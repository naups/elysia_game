<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Trivia Quiz — Multiplayer</title>
                <style>
            @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap');

            * { margin: 0; padding: 0; box-sizing: border-box; }
            :root {
                --primary: #4f46e5;
                --primary-hover: #4338ca;
                --primary-light: #e0e7ff;
                --secondary: #8b5cf6;
                --success: #0d9488;
                --success-light: #ccfbf1;
                --error: #e11d48;
                --error-light: #ffe4e6;
                --bg-base: #f8fafc;
                --card-bg: rgba(255, 255, 255, 0.92);
                --text-dark: #0f172a;
                --text-muted: #64748b;
                --border-color: #e2e8f0;
                --radius-lg: 24px;
                --radius-md: 16px;
                --shadow-sm: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -2px rgba(0,0,0,0.05);
                --shadow-md: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -4px rgba(0,0,0,0.05);
            }
            body {
                font-family: "Inter", "Segoe UI", sans-serif;
                background-color: var(--bg-base);
                min-height: 100vh;
                display: flex;
                justify-content: center;
                align-items: center;
                padding: 20px;
                position: relative;
                overflow-x: hidden;
            }
            body::before, body::after {
                content: ''; position: fixed; border-radius: 50%; filter: blur(100px); z-index: -1; opacity: 0.6;
            }
            body::before { width: 50vw; height: 50vh; background: #c7d2fe; top: -10%; left: -10%; }
            body::after { width: 60vw; height: 60vh; background: #99f6e4; bottom: -20%; right: -10%; opacity: 0.4; }

            .container {
                background: var(--card-bg);
                backdrop-filter: blur(20px);
                border-radius: var(--radius-lg);
                box-shadow: 0 25px 50px -12px rgba(0,0,0,0.15);
                max-width: 480px;
                width: 100%;
                overflow: hidden;
                border: 1px solid rgba(255,255,255,0.7);
                display: flex;
                flex-direction: column;
                transition: max-width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            }

            @media (min-width: 768px) {
                .container { max-width: 1000px; }
                .screen-grid { display: grid; grid-template-columns: 350px 1fr; gap: 30px; align-items: start; }
            }

            h1, h2, h3 { font-family: "Plus Jakarta Sans", sans-serif; color: var(--text-dark); }
            
            .header {
                background: transparent; color: var(--text-dark); padding: 24px 30px;
                display: flex; flex-direction: column; align-items: center;
                border-bottom: 1px solid var(--border-color); position: relative;
            }
            .header h1 { font-size: 1.5em; margin-bottom: 10px; font-weight: 800; }
            .header .score { font-weight: 600; color: var(--primary); margin-bottom: 10px; font-size: 1.1em; }
            .header .user-info { display: flex; align-items: center; gap: 12px; }
            .header .user-info img { width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--primary-light); }
            .header .user-info span { font-weight: 600; font-size: 15px; }
            
            .logout-btn {
                position: absolute; top: 24px; right: 24px;
                background: #fff; color: var(--text-muted); border: 1px solid var(--border-color);
                padding: 8px 16px; border-radius: var(--radius-md); cursor: pointer;
                font-size: 14px; font-weight: 600; transition: all 0.2s;
            }
            .logout-btn:hover { background: var(--error-light); color: var(--error); border-color: var(--error-light); }
            
            .progress-bar { background: var(--border-color); height: 8px; width: 100%; border-radius: 4px; overflow: hidden; margin-top: 15px; }
            .progress-fill { background: var(--success); height: 100%; transition: width 0.3s ease; }

            .content { padding: 30px; }
            @media (max-width: 767px) { .content { padding: 20px; } }
            .screen { display: none; }
            .screen.active { display: block; }
            .screen > h2 { text-align: center; margin-bottom: 24px; font-weight: 700; }
            
            input[type="text"], input[type="number"], select {
                width: 100%; padding: 14px 16px; font-size: 15px; font-weight: 500;
                border: 2px solid var(--border-color); border-radius: var(--radius-md);
                margin-bottom: 16px; background: #fff; transition: all 0.2s; font-family: inherit; color: var(--text-dark);
            }
            input:focus, select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 4px var(--primary-light); }

            .btn {
                width: 100%; padding: 16px; font-size: 16px; font-weight: 600;
                border: none; border-radius: var(--radius-md); cursor: pointer;
                transition: transform 0.2s, box-shadow 0.2s, background 0.2s;
                margin-bottom: 12px; font-family: inherit; display: inline-block; text-align: center;
            }
            .btn:hover:not(:disabled) { transform: translateY(-2px); }
            .btn:disabled { opacity: 0.6; cursor: not-allowed; }
            
            .btn-primary { background: var(--primary); color: white; box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3); }
            .btn-primary:hover:not(:disabled) { background: var(--primary-hover); box-shadow: 0 6px 16px rgba(79, 70, 229, 0.4); }
            .btn-success { background: var(--success); color: white; box-shadow: 0 4px 12px rgba(13, 148, 136, 0.3); }
            .btn-success:hover:not(:disabled) { background: #0f766e; }
            .btn-danger { background: var(--error); color: white; }
            .btn-secondary { background: #fff; color: var(--text-dark); border: 2px solid var(--border-color); }
            .btn-secondary:hover:not(:disabled) { border-color: var(--text-muted); }
            .btn-small { width: auto; padding: 10px 20px; font-size: 14px; }

            .error-msg { color: var(--error); text-align: center; margin-top: 10px; min-height: 20px; font-size: 14px; font-weight: 500; }
            
            .lobby-actions { display: flex; gap: 12px; margin-bottom: 24px; flex-direction: column; }
            @media (min-width: 768px) { .lobby-actions { flex-direction: row; } .lobby-actions .btn { flex: 1; } }

            .active-room-panel { background: var(--primary-light); border: 1px solid rgba(79,70,229,0.2); border-radius: var(--radius-md); padding: 20px; text-align: center; margin-bottom: 24px; }
            .active-room-panel div { color: var(--text-muted); font-size: 14px; font-weight: 500; }
            .active-room-panel strong { color: var(--primary); font-size: 1.5em; display: block; margin: 8px 0; font-family: "Plus Jakarta Sans"; letter-spacing: 2px;}
            .active-room-actions { display: flex; gap: 12px; justify-content: center; margin-top: 16px; }
            
            .room-code { text-align: center; font-size: 2.5em; font-weight: 800; color: var(--primary); letter-spacing: 8px; margin: 0 0 20px; padding: 24px; background: #fff; border-radius: var(--radius-md); border: 2px dashed var(--border-color); font-family: "Plus Jakarta Sans"; }
            
            .player-list { list-style: none; margin: 0 0 20px; background: #fff; border-radius: var(--radius-md); border: 1px solid var(--border-color); overflow: hidden; }
            .player-item { display: flex; align-items: center; padding: 16px; border-bottom: 1px solid var(--border-color); gap: 16px; }
            .player-item:last-child { border-bottom: none; }
            .player-item img { width: 44px; height: 44px; border-radius: 50%; background: var(--bg-base); }
            .player-name { flex: 1; font-weight: 600; font-size: 15px; color: var(--text-dark); }
            
            .player-badge { font-size: 12px; padding: 6px 12px; border-radius: 20px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
            .badge-master { background: #fffbeb; color: #d97706; }
            .badge-ready { background: var(--success-light); color: var(--success); }
            .badge-not-ready { background: var(--error-light); color: var(--error); }
            
            .kick-btn { background: var(--error-light); color: var(--error); border: none; padding: 8px 12px; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: 700; transition: background 0.2s; }
            .kick-btn:hover { background: #fda4af; }
            
            .settings-panel { background: #fff; border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 24px; margin-bottom: 24px; }
            .settings-panel h3 { margin-bottom: 20px; font-size: 18px; }
            .setting-row { margin-bottom: 16px; }
            .setting-row label { display: block; font-weight: 600; color: var(--text-dark); margin-bottom: 8px; font-size: 14px; }
            
            .timer-wrap { display: none; margin-bottom: 30px; }
            .timer-meta { display: flex; justify-content: space-between; color: var(--text-muted); font-size: 14px; font-weight: 700; margin-bottom: 8px; }
            .timer-bar { height: 10px; background: var(--border-color); border-radius: 5px; overflow: hidden; }
            .timer-fill { width: 100%; height: 100%; background: var(--success); transition: width 0.2s linear; }
            
            .question-text { font-size: 1.4em; font-weight: 700; color: var(--text-dark); margin-bottom: 30px; text-align: center; line-height: 1.5; font-family: "Plus Jakarta Sans"; }
            @media (min-width: 768px) { .question-text { font-size: 1.8em; margin-bottom: 40px; } }
            
            .options { display: grid; gap: 16px; grid-template-columns: 1fr; }
            @media (min-width: 768px) { .options { grid-template-columns: 1fr 1fr; gap: 20px; } }
            
            .option-btn {
                display: flex; align-items: center; gap: 16px;
                padding: 16px 20px; font-size: 16px; font-weight: 600; color: var(--text-dark);
                border: 2px solid var(--border-color); border-radius: var(--radius-md); background: #fff;
                cursor: pointer; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); text-align: left; line-height: 1.4;
            }
            .option-btn:hover:not(.disabled) { border-color: var(--primary); background: var(--primary-light); transform: translateY(-3px); box-shadow: var(--shadow-md); }
            
            .option-badge { display: flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 50%; background: var(--bg-base); color: var(--text-muted); font-size: 15px; font-weight: 700; flex-shrink: 0; transition: all 0.2s; }
            .option-btn:hover:not(.disabled) .option-badge { background: var(--primary); color: #fff; }
            
            .option-btn.correct { background: var(--success-light); border-color: var(--success); color: var(--success); }
            .option-btn.correct .option-badge { background: var(--success); color: #fff; }
            .option-btn.wrong { background: var(--error-light); border-color: var(--error); color: var(--error); opacity: 0.8; }
            .option-btn.wrong .option-badge { background: var(--error); color: #fff; }
            .option-btn.disabled { cursor: default; }
            .option-text { flex: 1; }
            
            .feedback { text-align: center; padding: 16px; border-radius: var(--radius-md); margin-top: 24px; font-weight: 700; min-height: 56px; display: flex; align-items: center; justify-content: center; font-size: 16px; }
            .feedback.correct { background: var(--success-light); color: var(--success); border: 1px solid rgba(13,148,136,0.3); }
            .feedback.wrong { background: var(--error-light); color: var(--error); border: 1px solid rgba(225,29,72,0.3); }
            
            .leaderboard-overlay { display: none; background: #fff; border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 24px; margin: 24px 0; box-shadow: var(--shadow-md); }
            .leaderboard-overlay.show { display: block; }
            .leaderboard-overlay h3 { text-align: center; margin-bottom: 20px; font-family: "Plus Jakarta Sans"; font-weight: 700; }
            .leaderboard-row { display: flex; justify-content: space-between; padding: 14px 16px; background: var(--bg-base); border-radius: 12px; margin-bottom: 8px; font-weight: 600; font-size: 15px; align-items: center; }
            .leaderboard-row.me { background: var(--primary-light); color: var(--primary); border: 1px solid rgba(79,70,229,0.3); }
            
            .podium { display: flex; align-items: flex-end; justify-content: center; gap: 16px; min-height: 220px; margin: 24px 0; }
            .podium-place { flex: 1; text-align: center; max-width: 140px; }
            .podium-player { font-weight: 700; color: var(--text-dark); margin-bottom: 12px; font-size: 15px; }
            .podium-bar { height: 0; border-radius: 16px 16px 0 0; color: white; display: flex; align-items: flex-end; justify-content: center; padding: 16px 8px; font-weight: 800; font-size: 24px; transition: height 1s cubic-bezier(0.34, 1.56, 0.64, 1); box-shadow: inset 0 -10px 20px rgba(0,0,0,0.15); }
            .podium-place.first .podium-bar { background: linear-gradient(135deg, #f59e0b, #d97706); }
            .podium-place.second .podium-bar { background: linear-gradient(135deg, #94a3b8, #64748b); }
            .podium-place.third .podium-bar { background: linear-gradient(135deg, #d97706, #b45309); }
            
            .ranking-table { width: 100%; border-collapse: separate; border-spacing: 0; margin: 24px 0; background: #fff; border-radius: var(--radius-md); border: 1px solid var(--border-color); overflow: hidden; }
            .ranking-table th, .ranking-table td { padding: 16px; text-align: left; border-bottom: 1px solid var(--border-color); font-size: 15px; }
            .ranking-table th { background: var(--bg-base); color: var(--text-muted); font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
            .ranking-table tr:last-child td { border-bottom: none; }
            
            .loading { display: flex; justify-content: center; align-items: center; padding: 80px; }
            .spinner { width: 50px; height: 50px; border: 4px solid var(--border-color); border-top: 4px solid var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; }
            
            @keyframes spin { to { transform: rotate(360deg); } }
            @keyframes correctPulse { 0% { transform: scale(1); } 50% { transform: scale(1.03); } 100% { transform: scale(1); } }
            @keyframes wrongShake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-8px); } 40% { transform: translateX(8px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(4px); } }
            .quiz-feedback-pulse { animation: correctPulse 0.4s ease; }
            .quiz-feedback-shake { animation: wrongShake 0.4s ease; }
            
            .hidden { display: none !important; }
            
            .answer-queue { text-align: center; margin-top: 20px; color: var(--text-muted); font-size: 15px; font-weight: 500; }
            .winner-card { text-align: center; padding: 30px; background: linear-gradient(135deg, #fffbeb 0%, #fef3c7 100%); border-radius: var(--radius-md); margin-bottom: 24px; border: 1px solid #fde68a; }
            .winner-card .trophy { font-size: 4em; margin-bottom: 10px; display: inline-block; }
            .winner-card .winner-name { font-size: 1.8em; font-weight: 800; margin: 5px 0; color: #d97706; font-family: "Plus Jakarta Sans"; }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="header">
                <h1>🎮 Trivia Quiz</h1>
                <div class="score" id="headerScore" style="display: none">
                    Score: 0
                </div>
                <div class="user-info" id="userInfo" style="display: none">
                    <img id="userAvatar" src="" alt="avatar" />
                    <span id="userName"></span>
                </div>
                <button
                    class="logout-btn"
                    id="logoutBtn"
                    style="display: none"
                    onclick="logout()"
                >
                    Logout
                </button>
                <div
                    class="progress-bar"
                    id="progressBar"
                    style="display: none"
                >
                    <div
                        class="progress-fill"
                        id="progressFill"
                        style="width: 0%"
                    ></div>
                </div>
            </div>

            <div class="content">
                <!-- Login Screen -->
                <div id="loginScreen" class="screen login-screen active">
                    <h2>Welcome to Trivia Quiz!</h2>
                    <input
                        type="text"
                        id="usernameInput"
                        placeholder="Enter your username"
                        maxlength="50"
                    />
                    <button class="btn btn-primary" onclick="registerUser()">
                        Start Playing
                    </button>
                    <div id="loginError" class="error-msg"></div>
                </div>

                <!-- Lobby Screen -->
                <div id="lobbyScreen" class="screen">
                    <h2>🎯 Lobby</h2>
                    <div class="screen-grid">
                        <div class="lobby-col-left">
                            <div class="lobby-actions">
                                <button class="btn btn-primary" onclick="showCreateRoom()">Create Room</button>
                                <button class="btn btn-secondary" onclick="showJoinRoom()">Join Room</button>
                            </div>
                            <div id="activeRoomPanel" class="active-room-panel hidden">
                                <div>Active room:</div>
                                <strong id="activeRoomCode">------</strong>
                                <div class="active-room-actions">
                                    <button class="btn btn-success btn-small" onclick="returnToActiveRoom()">Return to Room</button>
                                    <button class="btn btn-danger btn-small hidden" id="activeRoomDeleteBtn" onclick="deleteSavedRoom()">Delete</button>
                                </div>
                            </div>
                        </div>
                        <div class="lobby-col-right">

                    <!-- Join by code -->
                    <div id="joinForm" class="hidden">
                        <input
                            type="text"
                            id="roomCodeInput"
                            placeholder="Enter room code (e.g. ABC123)"
                            maxlength="6"
                            style="text-transform: uppercase"
                        />
                        <button class="btn btn-primary" onclick="joinRoom()">
                            Join
                        </button>
                    </div>

                    <!-- Create room settings -->
                    <div id="createForm" class="hidden">
                        <div class="settings-panel">
                            <h3>Room Settings</h3>
                            <div class="setting-row">
                                <label>Max Players</label>
                                <input
                                    type="number"
                                    id="setMaxPlayers"
                                    value="6"
                                    min="2"
                                    max="10"
                                />
                            </div>
                            <div class="setting-row">
                                <label>Questions</label>
                                <input
                                    type="number"
                                    id="setQuestionCount"
                                    value="5"
                                    min="3"
                                    max="20"
                                />
                            </div>
                            <div class="setting-row">
                                <label>Question Delay</label>
                                <input
                                    type="number"
                                    id="setQuestionDelay"
                                    value="10"
                                    min="0"
                                    max="60"
                                />
                            </div>
                            <div class="setting-row">
                                <label>Time per Question</label>
                                <input
                                    type="number"
                                    id="setTimePerQuestion"
                                    value="0"
                                    min="0"
                                    max="300"
                                />
                            </div>
                            <div class="setting-row">
                                <label>Idle Timeout</label>
                                <input
                                    type="number"
                                    id="setRoomIdleTimeout"
                                    value="1800"
                                    min="0"
                                    max="86400"
                                />
                            </div>
                            <div class="setting-row">
                                <label>Source</label>
                                <select
                                    id="setQuestionSource"
                                    onchange="toggleCustomQ()"
                                >
                                    <option value="database">Database</option>
                                    <option value="custom">Custom</option>
                                </select>
                            </div>
                            <div class="setting-row">
                                <label>Mode</label>
                                <select id="setQuestionMode">
                                    <option value="same_for_all">
                                        Same for All
                                    </option>
                                    <option value="random_per_player">
                                        Random per Player
                                    </option>
                                </select>
                            </div>
                            <div class="setting-row">
                                <label>Show Results</label>
                                <select id="setResultMode">
                                    <option value="instant">
                                        After Each Answer
                                    </option>
                                    <option value="end">At End</option>
                                </select>
                            </div>
                            <!-- Custom Questions Editor -->
                            <div id="customQEditor" class="hidden">
                                <h3 style="margin-top: 15px">
                                    Custom Questions
                                </h3>
                                <div id="customQList"></div>
                                <button
                                    class="btn btn-secondary btn-small"
                                    onclick="addCustomQuestion()"
                                    style="margin-top: 10px"
                                >
                                    + Add Question
                                </button>
                            </div>
                        </div>
                        <button class="btn btn-success" onclick="createRoom()">
                            Create Room
                        </button>
                    </div>
                        </div>
                    </div>
                    <div id="lobbyError" class="error-msg"></div>
                </div>

                <!-- Room Screen -->
                <div id="roomScreen" class="screen">
                    <h2>🏠 Room</h2>
                    <div class="screen-grid">
                        <div class="room-col-left">
                            <div class="room-code" id="roomCodeDisplay">------</div>
                            <p style="text-align: center; color: var(--text-muted); margin-bottom: 20px; font-weight: 500;">
                                Share this code with friends to join
                            </p>
                            <div class="settings-panel" id="roomSettingsDisplay">
                                <h3>Settings</h3>
                                <div id="roomSettingsInfo"></div>
                            </div>
                            <div style="display: flex; gap: 12px; flex-direction: column;">
                                <button class="btn btn-secondary" onclick="backToLobby()">Back to Lobby</button>
                                <button class="btn btn-danger" onclick="leaveRoom()" style="background: var(--error-light); color: var(--error);">Leave Room</button>
                            </div>
                        </div>
                        <div class="room-col-right">
                            <h3 style="margin-bottom: 15px;">Players</h3>
                            <ul class="player-list" id="playerList"></ul>
                            <div style="display: flex; gap: 12px;">
                                <button class="btn btn-primary" id="readyBtn" onclick="toggleReady()">Ready</button>
                                <button class="btn btn-success hidden" id="startBtn" onclick="startGame()">Start Game</button>
                            </div>
                            <div id="roomError" class="error-msg"></div>
                        </div>
                    </div>
                </div>

                <!-- Loading -->
                <div id="loadingScreen" class="screen loading">
                    <div class="spinner"></div>
                </div>

                <!-- Quiz Screen -->
                <div id="quizScreen" class="screen">
                    <div class="timer-wrap" id="questionTimer">
                        <div class="timer-meta">
                            <span>Time</span>
                            <span id="timerText">0s</span>
                        </div>
                        <div class="timer-bar">
                            <div class="timer-fill" id="timerFill"></div>
                        </div>
                    </div>
                    <div class="question-text" id="questionText"></div>
                    <div class="options" id="optionsContainer"></div>
                    <div class="feedback" id="feedback"></div>
                    <div class="leaderboard-overlay" id="leaderboardOverlay"></div>
                    <div class="answer-queue" id="answerQueue"></div>
                </div>

                <!-- Summary Screen -->
                <div id="summaryScreen" class="screen summary-screen">
                    <h2>📊 Quiz Summary</h2>
                    <div id="winnerCard"></div>
                    <div class="screen-grid" style="align-items: stretch;">
                        <div class="summary-col-left">
                            <div id="podiumContainer"></div>
                        </div>
                        <div class="summary-col-right">
                            <table class="ranking-table">
                                <thead>
                                    <tr>
                                        <th>#</th>
                                        <th>Player</th>
                                        <th>Score</th>
                                        <th>Accuracy</th>
                                    </tr>
                                </thead>
                                <tbody id="rankingBody"></tbody>
                            </table>
                            <div id="detailSection"></div>
                            <button class="btn btn-primary" onclick="backToLobby()" style="margin-top: 15px">Back to Lobby</button>
                        </div>
                    </div>
                </div>

                <!-- Solo Result (for single-player mode) -->
                <div id="resultScreen" class="screen">
                    <h2>🎉 Quiz Complete!</h2>
                    <div
                        style="
                            font-size: 3em;
                            text-align: center;
                            margin: 20px 0;
                        "
                        id="finalScore"
                    >
                        0
                    </div>
                    <div
                        style="
                            text-align: center;
                            color: #666;
                            margin-bottom: 20px;
                        "
                        id="resultMessage"
                    ></div>
                    <button class="btn btn-success" onclick="backToLobby()">
                        Back to Lobby
                    </button>
                </div>
            </div>
        </div>
        <div class="confetti-layer" id="confettiLayer"></div>

        <script>
            // ═══════════════════════════════════════════════════════════
            //  STATE
            // ═══════════════════════════════════════════════════════════

            let currentUser = null;
            let authToken = null;
            let ws = null;
            let currentRoomCode = null;
            let currentQuestion = null;
            let questionOrder = 0;
            let totalQuestions = 5;
            let resultMode = "instant";
            let isMaster = false;
            let roomMasterId = null;
            let wsAuthenticated = false;
            let wsQueue = [];
            let roomPollingInterval = null;
            let transitionCountdownTimer = null;
            let waitingRecoveryTimer = null;
            let questionTimerInterval = null;
            let timePerQuestionSeconds = 0;
            let currentQuestionStartedAt = null;
            let answerSubmitted = false;
            let questionInputLocked = false;
            let deletingRoomCode = null;
            const locallyDeletedRooms = new Set();

            // ═══════════════════════════════════════════════════════════
            //  SCREEN MANAGEMENT
            // ═══════════════════════════════════════════════════════════

            function showScreen(screenId) {
                const screens = document.querySelectorAll(".screen");
                screens.forEach((s) => {
                    s.style.display = "none";
                    s.classList.remove("active");
                });
                const target = document.getElementById(screenId);
                target.classList.add("active");
                // Loading screen uses flex, others use block
                if (screenId === "loadingScreen") {
                    target.style.display = "flex";
                } else {
                    target.style.display = "block";
                }
            }

            function updateProgress() {
                const pct = (questionOrder / totalQuestions) * 100;
                document.getElementById("progressFill").style.width = pct + "%";
            }

            function showUserHeader(show) {
                document.getElementById("logoutBtn").style.display = show
                    ? "block"
                    : "none";
                document.getElementById("userInfo").style.display = show
                    ? "flex"
                    : "none";
            }

            function showScoreBar(show) {
                document.getElementById("headerScore").style.display = show
                    ? "block"
                    : "none";
                document.getElementById("progressBar").style.display = show
                    ? "block"
                    : "none";
            }

            function escapeHtml(value) {
                return String(value ?? "").replace(
                    /[&<>"']/g,
                    (char) =>
                        ({
                            "&": "&amp;",
                            "<": "&lt;",
                            ">": "&gt;",
                            '"': "&quot;",
                            "'": "&#39;",
                        })[char],
                );
            }

            function getUrlRoomCode() {
                const code = new URLSearchParams(window.location.search).get(
                    "room",
                );
                return code ? code.trim().toUpperCase() : null;
            }

            function setRoomUrl(roomCode) {
                const url = new URL(window.location.href);
                if (roomCode) url.searchParams.set("room", roomCode);
                else url.searchParams.delete("room");
                window.history.replaceState(
                    {},
                    "",
                    `${url.pathname}${url.search}${url.hash}`,
                );
            }

            function getSavedRoomCode() {
                return (
                    getUrlRoomCode() ||
                    localStorage.getItem("roomCode")?.toUpperCase() ||
                    null
                );
            }

            function persistRoomCode(roomCode) {
                if (!roomCode) return;
                const code = roomCode.toUpperCase();
                currentRoomCode = code;
                localStorage.setItem("roomCode", code);
                setRoomUrl(code);
            }

            function clearRoomReference() {
                clearWaitingRecoveryTimer();
                stopQuestionTimer();
                hideLeaderboardOverlay();
                currentRoomCode = null;
                roomMasterId = null;
                isMaster = false;
                localStorage.removeItem("roomCode");
                setRoomUrl(null);
                updateActiveRoomPanel();
            }

            function updateActiveRoomPanel() {
                const panel = document.getElementById("activeRoomPanel");
                if (!panel) return;
                const code = currentRoomCode || getSavedRoomCode();
                panel.classList.toggle("hidden", !code);
                if (code) {
                    document.getElementById("activeRoomCode").textContent =
                        code;
                }
                const deleteBtn = document.getElementById("activeRoomDeleteBtn");
                if (deleteBtn) {
                    const canDelete =
                        !!code &&
                        !!currentUser &&
                        (isMaster || roomMasterId === currentUser.id);
                    deleteBtn.classList.toggle("hidden", !canDelete);
                }
            }

            // Polling for room state updates
            function startRoomPolling() {
                stopRoomPolling();
                roomPollingInterval = setInterval(async () => {
                    if (!currentRoomCode) return;
                    try {
                        const data = await api(
                            "GET",
                            `/api/rooms/${currentRoomCode}`,
                        );
                        if (data.success) {
                            renderPlayerList(
                                data.room.players,
                                data.room.masterId,
                            );
                        }
                    } catch (_) {}
                }, 3000);
            }

            function stopRoomPolling() {
                if (roomPollingInterval) {
                    clearInterval(roomPollingInterval);
                    roomPollingInterval = null;
                }
            }

            // ═══════════════════════════════════════════════════════════
            //  API HELPERS
            // ═══════════════════════════════════════════════════════════

            async function api(method, path, body = null) {
                const opts = {
                    method,
                    headers: {
                        "Content-Type": "application/json",
                        ...(authToken
                            ? { Authorization: `Bearer ${authToken}` }
                            : {}),
                    },
                };
                if (body) opts.body = JSON.stringify(body);
                const res = await fetch(path, opts);
                return res.json();
            }

            // ═══════════════════════════════════════════════════════════
            //  AUTH
            // ═══════════════════════════════════════════════════════════

            async function registerUser() {
                const username = document
                    .getElementById("usernameInput")
                    .value.trim();
                const errEl = document.getElementById("loginError");

                if (!username || username.length < 2) {
                    errEl.textContent =
                        "Username must be at least 2 characters";
                    return;
                }

                showScreen("loadingScreen");

                try {
                    const data = await api("POST", "/api/register", {
                        username,
                    });
                    if (data.success) {
                        currentUser = data.user;
                        authToken = data.token;
                        localStorage.setItem("authToken", authToken);
                        localStorage.setItem("userId", currentUser.id);
                        localStorage.setItem("username", currentUser.username);
                        localStorage.setItem("userAvatar", currentUser.avatar);
                        const roomFromLink = getUrlRoomCode();
                        if (roomFromLink) {
                            await restoreRoomFromCode(roomFromLink);
                        } else {
                            enterLobby();
                        }
                    } else {
                        showScreen("loginScreen");
                        errEl.textContent =
                            data.message || "Registration failed";
                    }
                } catch (e) {
                    showScreen("loginScreen");
                    errEl.textContent = "Connection error";
                }
            }

            async function logout() {
                try {
                    await api("POST", "/api/logout");
                } catch (_) {}
                currentUser = null;
                authToken = null;
                clearRoomReference();
                localStorage.removeItem("authToken");
                localStorage.removeItem("userId");
                localStorage.removeItem("username");
                disconnectWS();
                showUserHeader(false);
                showScoreBar(false);
                showScreen("loginScreen");
            }

            async function validateSession() {
                const savedToken = localStorage.getItem("authToken");
                if (!savedToken) return false;

                authToken = savedToken;
                try {
                    const data = await api("GET", "/api/auth/validate");
                    if (data.success) {
                        currentUser = data.user;
                        return true;
                    }
                } catch (_) {}
                return false;
            }

            // ═══════════════════════════════════════════════════════════
            //  WEBSOCKET
            // ═══════════════════════════════════════════════════════════

            function connectWS() {
                if (ws && ws.readyState === WebSocket.OPEN) return;

                const protocol =
                    location.protocol === "https:" ? "wss:" : "ws:";
                ws = new WebSocket(`${protocol}//${location.host}/ws`);
                wsAuthenticated = false;
                wsQueue = [];

                ws.onopen = () => {
                    ws.send(JSON.stringify({ type: "auth", token: authToken }));
                };

                ws.onmessage = (event) => {
                    const data = JSON.parse(event.data);

                    // Handle auth_ok first — flush queued messages
                    if (data.type === "auth_ok") {
                        wsAuthenticated = true;
                        // Rejoin room if reconnecting
                        const savedRoom = getSavedRoomCode();
                        if (savedRoom) {
                            persistRoomCode(savedRoom);
                            wsQueue.push({
                                type: "join_room",
                                roomCode: savedRoom,
                                token: authToken,
                            });
                        }
                        // Flush queue
                        for (const msg of wsQueue) {
                            ws.send(JSON.stringify(msg));
                        }
                        wsQueue = [];
                        // Refresh room state after rejoin
                        if (savedRoom) {
                            setTimeout(() => refreshRoomState(), 300);
                        }
                        return;
                    }

                    handleWSMessage(data);
                };

                ws.onclose = () => {
                    wsAuthenticated = false;
                    // Auto-reconnect after 3 seconds
                    if (authToken) {
                        setTimeout(connectWS, 3000);
                    }
                };
            }

            function disconnectWS() {
                if (ws) {
                    ws.close();
                    ws = null;
                }
            }

            function wsSend(data) {
                if (ws && ws.readyState === WebSocket.OPEN && wsAuthenticated) {
                    ws.send(JSON.stringify(data));
                } else {
                    wsQueue.push(data);
                }
            }

            function handleWSMessage(data) {
                switch (data.type) {
                    case "auth_ok":
                        break;
                    case "room_joined":
                        break;
                    case "player_joined":
                        addPlayerToList(data.player);
                        break;
                    case "player_left":
                        removePlayerFromList(data.userId);
                        break;
                    case "player_kicked":
                        if (data.userId === currentUser.id) {
                            alert("You have been kicked from the room.");
                            clearRoomReference();
                            enterLobby();
                        } else {
                            removePlayerFromList(data.userId);
                        }
                        break;
                    case "player_ready":
                        updatePlayerReady(data.userId, data.isReady);
                        break;
                    case "user_connected":
                        // Refresh room state
                        if (currentRoomCode) refreshRoomState();
                        break;
                    case "user_disconnected":
                        break;
                    case "game_started":
                        clearWaitingRecoveryTimer();
                        questionOrder = 0;
                        totalQuestions = data.totalQuestions;
                        resultMode = data.resultMode;
                        stopRoomPolling();
                        showScoreBar(true);
                        handleNextQuestion(data);
                        break;
                    case "next_question":
                        stopTransitionCountdown();
                        handleNextQuestion(data);
                        break;
                    case "question_transition_scheduled":
                        startTransitionCountdown(data);
                        break;
                    case "answer_result":
                        handleAnswerResult(data);
                        break;
                    case "game_over":
                        stopTransitionCountdown();
                        clearWaitingRecoveryTimer();
                        if (
                            currentRoomCode &&
                            (document.getElementById("quizScreen").style
                                .display !== "none" ||
                                document.getElementById("loadingScreen").style
                                    .display !== "none")
                        ) {
                            showSummary(data.summary);
                        }
                        break;
                    case "room_deleted": {
                        const deletedCode = data.roomCode?.toUpperCase();
                        const savedCode = getSavedRoomCode();
                        if (
                            deletedCode &&
                            (deletedCode === currentRoomCode ||
                                deletedCode === savedCode)
                        ) {
                            const isLocalDelete =
                                deletingRoomCode === deletedCode ||
                                locallyDeletedRooms.has(deletedCode);
                            clearRoomReference();
                            enterLobby();
                            if (!isLocalDelete) {
                                alert(
                                    data.reason === "idle_timeout"
                                        ? "Room expired because it was idle."
                                        : "Room was deleted.",
                                );
                            }
                        }
                        break;
                    }
                    case "error":
                        console.error("WS error:", data.message);
                        break;
                }
            }

            // ═══════════════════════════════════════════════════════════
            //  LOBBY
            // ═══════════════════════════════════════════════════════════

            function enterLobby() {
                clearWaitingRecoveryTimer();
                stopQuestionTimer();
                hideLeaderboardOverlay();
                document.getElementById("userAvatar").src =
                    currentUser.avatar ||
                    `https://api.dicebear.com/7.x/thumbs/svg?seed=${encodeURIComponent(currentUser.username)}`;
                document.getElementById("userName").textContent =
                    currentUser.username;
                showUserHeader(true);
                showScoreBar(false);
                showScreen("lobbyScreen");
                updateActiveRoomPanel();
                connectWS();
            }

            function showCreateRoom() {
                document
                    .getElementById("createForm")
                    .classList.remove("hidden");
                document.getElementById("joinForm").classList.add("hidden");
            }

            function showJoinRoom() {
                document.getElementById("joinForm").classList.remove("hidden");
                document.getElementById("createForm").classList.add("hidden");
            }

            function toggleCustomQ() {
                const isCustom =
                    document.getElementById("setQuestionSource").value ===
                    "custom";
                document
                    .getElementById("customQEditor")
                    .classList.toggle("hidden", !isCustom);
            }

            let customQuestions = [];
            function addCustomQuestion() {
                const idx = customQuestions.length;
                customQuestions.push({
                    text: "",
                    type: "multiple_choice",
                    options: ["", "", "", ""],
                    correct_answer: "",
                });

                const list = document.getElementById("customQList");
                const div = document.createElement("div");
                div.className = "custom-q-form";
                div.id = `cq_${idx}`;
                div.innerHTML = `
                    <strong>Q${idx + 1}</strong>
                    <input type="text" placeholder="Question text" onchange="customQuestions[${idx}].text=this.value" />
                    <select onchange="setCustomQuestionType(${idx}, this.value)">
                        <option value="multiple_choice">Multiple Choice</option>
                        <option value="true_false">True / False</option>
                        <option value="fill_blank">Fill in Blank</option>
                    </select>
                    <input type="text" placeholder="Option A" onchange="customQuestions[${idx}].options[0]=this.value" />
                    <input type="text" placeholder="Option B" onchange="customQuestions[${idx}].options[1]=this.value" />
                    <input type="text" placeholder="Option C" onchange="customQuestions[${idx}].options[2]=this.value" />
                    <input type="text" placeholder="Option D" onchange="customQuestions[${idx}].options[3]=this.value" />
                    <input type="text" placeholder="Correct Answer" onchange="customQuestions[${idx}].correct_answer=this.value" />
                `;
                list.appendChild(div);
            }

            function setCustomQuestionType(index, type) {
                const question = customQuestions[index];
                if (!question) return;
                question.type = type;
                if (type === "true_false") {
                    question.options = ["True", "False"];
                    question.correct_answer = "True";
                } else if (type === "fill_blank") {
                    question.options = [];
                } else if (!Array.isArray(question.options) || question.options.length < 4) {
                    question.options = ["", "", "", ""];
                }
            }

            // ═══════════════════════════════════════════════════════════
            //  ROOM MANAGEMENT
            // ═══════════════════════════════════════════════════════════

            async function createRoom() {
                const errEl = document.getElementById("lobbyError");
                const delaySeconds = parseInt(
                    document.getElementById("setQuestionDelay").value,
                    10,
                );
                const timeLimitSeconds = parseInt(
                    document.getElementById("setTimePerQuestion").value,
                    10,
                );
                const idleTimeoutSeconds = parseInt(
                    document.getElementById("setRoomIdleTimeout").value,
                    10,
                );
                const settings = {
                    maxPlayers:
                        parseInt(
                            document.getElementById("setMaxPlayers").value,
                        ) || 6,
                    questionCount:
                        parseInt(
                            document.getElementById("setQuestionCount").value,
                        ) || 5,
                    questionSource:
                        document.getElementById("setQuestionSource").value,
                    questionMode:
                        document.getElementById("setQuestionMode").value,
                    resultMode: document.getElementById("setResultMode").value,
                    questionDelaySeconds: Number.isFinite(delaySeconds)
                        ? delaySeconds
                        : 10,
                    timePerQuestion: Number.isFinite(timeLimitSeconds)
                        ? timeLimitSeconds
                        : 0,
                    roomIdleTimeoutSeconds: Number.isFinite(idleTimeoutSeconds)
                        ? idleTimeoutSeconds
                        : 1800,
                    customQuestions:
                        document.getElementById("setQuestionSource").value ===
                        "custom"
                            ? customQuestions
                            : [],
                };

                try {
                    const data = await api("POST", "/api/rooms", settings);
                    if (data.success) {
                        persistRoomCode(data.room.code);
                        isMaster = true;
                        // Add masterId so showRoomScreen can render correctly
                        data.room.masterId = currentUser.id;
                        // Add master as first player for room display
                        if (!data.room.players) {
                            data.room.players = [
                                {
                                    userId: currentUser.id,
                                    username: currentUser.username,
                                    avatar: currentUser.avatar,
                                    isReady: true,
                                    score: 0,
                                },
                            ];
                        }
                        wsSend({
                            type: "join_room",
                            roomCode: currentRoomCode,
                            token: authToken,
                        });
                        showRoomScreen(data.room);
                    } else {
                        errEl.textContent = data.message;
                    }
                } catch (e) {
                    errEl.textContent = "Failed to create room";
                }
            }

            async function joinRoom() {
                const code = document
                    .getElementById("roomCodeInput")
                    .value.trim()
                    .toUpperCase();
                const errEl = document.getElementById("lobbyError");

                if (!code || code.length < 4) {
                    errEl.textContent = "Enter a valid room code";
                    return;
                }

                try {
                    const data = await api("POST", `/api/rooms/${code}/join`);
                    if (data.success) {
                        persistRoomCode(code);
                        isMaster = data.room.masterId === currentUser.id;
                        wsSend({
                            type: "join_room",
                            roomCode: code,
                            token: authToken,
                        });
                        showRoomScreen(data.room);
                    } else {
                        errEl.textContent = data.message;
                    }
                } catch (e) {
                    errEl.textContent = "Failed to join room";
                }
            }

            async function leaveRoom() {
                if (currentRoomCode) {
                    stopRoomPolling();
                    try {
                        await api(
                            "POST",
                            `/api/rooms/${currentRoomCode}/leave`,
                        );
                    } catch (_) {}
                    wsSend({
                        type: "leave_room",
                        roomCode: currentRoomCode,
                        token: authToken,
                    });
                    clearRoomReference();
                    enterLobby();
                }
            }

            async function toggleReady() {
                if (!currentRoomCode || isMaster) return;
                const data = await api(
                    "POST",
                    `/api/rooms/${currentRoomCode}/ready`,
                );
                if (data.success) {
                    const btn = document.getElementById("readyBtn");
                    btn.textContent = data.isReady ? "Not Ready" : "Ready";
                    btn.className = data.isReady
                        ? "btn btn-danger"
                        : "btn btn-primary";
                }
            }

            async function kickPlayer(userId) {
                if (!currentRoomCode) return;
                await api("POST", `/api/rooms/${currentRoomCode}/kick`, {
                    targetUserId: userId,
                    code: currentRoomCode,
                });
            }

            async function startGame() {
                if (!currentRoomCode) return;
                const errEl = document.getElementById("roomError");
                errEl.textContent = ""; // Clear previous errors
                try {
                    const data = await api(
                        "POST",
                        `/api/rooms/${currentRoomCode}/start`,
                    );
                    if (!data.success) {
                        errEl.textContent = "⚠ " + data.message;
                    } else {
                        stopRoomPolling();
                        // Transition to quiz from REST response (fallback)
                        if (data.gameStarted && data.questions) {
                            handleNextQuestion({
                                questions: data.questions,
                                questionNumber: data.questionNumber,
                                totalQuestions: data.totalQuestions,
                                resultMode: data.resultMode,
                                timePerQuestionSeconds:
                                    data.timePerQuestionSeconds,
                                questionStartedAt: data.questionStartedAt,
                            });
                        }
                    }
                } catch (e) {
                    errEl.textContent = "Failed to start game";
                }
            }

            async function refreshRoomState() {
                if (!currentRoomCode) return;
                try {
                    const data = await api(
                        "GET",
                        `/api/rooms/${currentRoomCode}`,
                    );
                    if (data.success) {
                        showRoomScreen(data.room);
                    }
                } catch (_) {}
            }

            async function restoreRoomFromCode(roomCode) {
                const code = roomCode?.trim().toUpperCase();
                if (!code) return false;

                persistRoomCode(code);
                document.getElementById("userAvatar").src =
                    currentUser.avatar ||
                    `https://api.dicebear.com/7.x/thumbs/svg?seed=${encodeURIComponent(currentUser.username)}`;
                document.getElementById("userName").textContent =
                    currentUser.username;
                showUserHeader(true);
                showScreen("loadingScreen");
                connectWS();

                try {
                    const data = await api("GET", `/api/rooms/${code}/state`);
                    if (!data.success || !data.room) {
                        if (data.message === "Forbidden") {
                            currentRoomCode = null;
                            roomMasterId = null;
                            localStorage.removeItem("roomCode");
                            setRoomUrl(code);
                            enterLobby();
                            showJoinRoom();
                            document.getElementById("roomCodeInput").value =
                                code;
                            document.getElementById("lobbyError").textContent =
                                "Join this room to continue";
                            return false;
                        }
                        clearRoomReference();
                        enterLobby();
                        return false;
                    }

                    roomMasterId = data.room.masterId;
                    isMaster = data.room.masterId === currentUser.id;
                    persistRoomCode(data.room.code);
                    wsSend({
                        type: "join_room",
                        roomCode: data.room.code,
                        token: authToken,
                    });

                    if (data.finished && data.summary) {
                        if (isCurrentUserRoomParticipant(data.room)) {
                            showSummary(data.summary);
                        } else {
                            clearRoomReference();
                            enterLobby();
                        }
                        return true;
                    }

                    if (data.inGame && data.gameState) {
                        questionOrder = data.gameState.questionNumber;
                        totalQuestions = data.gameState.totalQuestions;
                        resultMode = data.gameState.resultMode;
                        showScoreBar(true);
                        handleNextQuestion({
                            questions: data.gameState.questions,
                            questionNumber: data.gameState.questionNumber,
                            totalQuestions: data.gameState.totalQuestions,
                            resultMode: data.gameState.resultMode,
                            timePerQuestionSeconds:
                                data.gameState.timePerQuestionSeconds,
                            questionStartedAt:
                                data.gameState.questionStartedAt,
                        });
                        if (data.gameState.alreadyAnswered) {
                            setTimeout(() => {
                                answerSubmitted = true;
                                stopQuestionTimer();
                                questionInputLocked = true;
                                setAnswerControlsDisabled(true);
                                if (data.gameState.transition) {
                                    startTransitionCountdown(
                                        data.gameState.transition,
                                    );
                                } else {
                                    document.getElementById(
                                        "answerQueue",
                                    ).textContent =
                                        "Waiting for other players...";
                                    startWaitingRecoveryTimer();
                                }
                            }, 100);
                        }
                        return true;
                    }

                    if (data.room.status === "waiting") {
                        showRoomScreen(data.room);
                        return true;
                    }

                    enterLobby();
                    return false;
                } catch (_) {
                    clearRoomReference();
                    enterLobby();
                    return false;
                }
            }

            async function returnToActiveRoom() {
                const code = getSavedRoomCode();
                if (!code) return;
                await restoreRoomFromCode(code);
            }

            async function deleteSavedRoom() {
                const code = getSavedRoomCode();
                if (!code) return;

                const errEl = document.getElementById("lobbyError");
                errEl.textContent = "";
                if (!confirm(`Delete room ${code}?`)) return;

                deletingRoomCode = code;
                locallyDeletedRooms.add(code);
                try {
                    const data = await api("DELETE", `/api/rooms/${code}`);
                    if (data.success) {
                        clearRoomReference();
                        enterLobby();
                        return;
                    }

                    if (data.message === "Room not found") {
                        clearRoomReference();
                        enterLobby();
                        return;
                    }

                    errEl.textContent = data.message || "Failed to delete room";
                } catch (_) {
                    errEl.textContent = "Failed to delete room";
                } finally {
                    deletingRoomCode = null;
                    setTimeout(() => locallyDeletedRooms.delete(code), 5000);
                }
            }

            // ═══════════════════════════════════════════════════════════
            //  ROOM UI
            // ═══════════════════════════════════════════════════════════

            function showRoomScreen(room) {
                persistRoomCode(room.code);
                showScreen("roomScreen");
                showScoreBar(false);

                document.getElementById("roomCodeDisplay").textContent =
                    room.code;

                // Settings
                const s = room.settings;
                const settingsInfo =
                    document.getElementById("roomSettingsInfo");
                const settingsText = document.createElement("div");
                settingsText.style.fontSize = "14px";
                settingsText.style.color = "#666";
                settingsText.style.whiteSpace = "pre-line";
                settingsText.textContent =
                    `Max Players: ${s.max_players} | Questions: ${s.question_count}\n` +
                    `Question Delay: ${s.question_delay_seconds ?? 10}s\n` +
                    `Time per Question: ${s.time_per_question_seconds || 0}s\n` +
                    `Idle Timeout: ${s.room_idle_timeout_seconds ?? 1800}s\n` +
                    `Source: ${s.question_source} | Mode: ${
                        s.question_mode === "same_for_all"
                            ? "Same for All"
                            : "Random per Player"
                    }\n` +
                    `Results: ${s.result_mode === "instant" ? "Instant" : "At End"}`;
                settingsInfo.replaceChildren(settingsText);
                // Set master flag BEFORE rendering
                roomMasterId = room.masterId;
                isMaster = room.masterId === currentUser.id;
                document
                    .getElementById("startBtn")
                    .classList.toggle("hidden", !isMaster);

                // Update ready button for master (always ready, disabled)
                const readyBtn = document.getElementById("readyBtn");
                if (isMaster) {
                    readyBtn.textContent = "✓ Always Ready";
                    readyBtn.className = "btn btn-secondary";
                    readyBtn.disabled = true;
                    readyBtn.style.cursor = "not-allowed";
                } else {
                    readyBtn.textContent = "Ready";
                    readyBtn.className = "btn btn-primary";
                    readyBtn.disabled = false;
                    readyBtn.style.cursor = "pointer";
                }

                // Player list
                renderPlayerList(room.players, room.masterId);

                // Start polling for live updates
                startRoomPolling();
            }

            function renderPlayerList(players, masterId) {
                const list = document.getElementById("playerList");
                list.innerHTML = "";
                players.forEach((p) => {
                    const isPlayerMaster = p.userId === masterId;
                    const isMe = p.userId === currentUser.id;
                    const li = document.createElement("li");
                    li.className = "player-item";
                    li.id = `player_${p.userId}`;

                    li.innerHTML = `
                        <img src="${escapeHtml(p.avatar)}" alt="${escapeHtml(p.username)}" />
                        <span class="player-name">
                            ${escapeHtml(p.username)}
                            ${isMe ? " (You)" : ""}
                        </span>
                        ${isPlayerMaster ? '<span class="player-badge" style="background:#fff3e0;color:#e65100">👑 Master</span>' : ""}
                        <span class="player-badge ${p.isReady ? "badge-ready" : "badge-not-ready"}">
                            ${p.isReady ? "✓ Ready" : "✗ Not Ready"}
                        </span>
                        ${
                            isMaster && !isMe && !isPlayerMaster
                                ? `<button class="kick-btn" onclick="kickPlayer('${escapeHtml(p.userId)}')">Kick</button>`
                                : ""
                        }
                    `;
                    list.appendChild(li);
                });
            }

            function addPlayerToList(player) {
                const list = document.getElementById("playerList");
                if (document.getElementById(`player_${player.userId}`)) return;
                const isPlayerMaster = player.userId === roomMasterId;
                const isMe = player.userId === currentUser.id;
                const li = document.createElement("li");
                li.className = "player-item";
                li.id = `player_${player.userId}`;
                li.innerHTML = `
                    <img src="${escapeHtml(player.avatar)}" alt="${escapeHtml(player.username)}" />
                    <span class="player-name">${escapeHtml(player.username)}${isMe ? " (You)" : ""}</span>
                    ${isPlayerMaster ? '<span class="player-badge" style="background:#fff3e0;color:#e65100">👑 Master</span>' : ""}
                    <span class="player-badge badge-not-ready">✗ Not Ready</span>
                    ${
                        isMaster && !isMe && !isPlayerMaster
                            ? `<button class="kick-btn" onclick="kickPlayer('${escapeHtml(player.userId)}')">Kick</button>`
                            : ""
                    }
                `;
                list.appendChild(li);
            }

            function removePlayerFromList(userId) {
                const el = document.getElementById(`player_${userId}`);
                if (el) el.remove();
            }

            function updatePlayerReady(userId, isReady) {
                const el = document.getElementById(`player_${userId}`);
                if (!el) return;
                const badge = el.querySelector(".player-badge");
                if (badge) {
                    badge.className = `player-badge ${isReady ? "badge-ready" : "badge-not-ready"}`;
                    badge.textContent = isReady ? "✓ Ready" : "✗ Not Ready";
                }
            }

            // ═══════════════════════════════════════════════════════════
            //  QUIZ GAME
            // ═══════════════════════════════════════════════════════════

            function handleNextQuestion(data) {
                stopTransitionCountdown();
                stopQuestionTimer();
                hideLeaderboardOverlay();
                clearWaitingRecoveryTimer();
                questionOrder = data.questionNumber;
                totalQuestions = data.totalQuestions;
                resultMode = data.resultMode;
                timePerQuestionSeconds = data.timePerQuestionSeconds || 0;
                currentQuestionStartedAt = data.questionStartedAt || null;
                answerSubmitted = false;
                questionInputLocked = false;
                updateProgress();

                // Get question — could be same for all or per-player
                let question;
                if (data.questions?.all) {
                    question = data.questions.all;
                } else if (data.questions?.[currentUser.id]) {
                    question = data.questions[currentUser.id];
                } else {
                    question = data.questions;
                }

                if (!question) {
                    document.getElementById("answerQueue").textContent =
                        "Question is unavailable. Refreshing room state...";
                    return;
                }

                currentQuestion = question;
                document.getElementById("headerScore").textContent =
                    `Question ${questionOrder}/${totalQuestions}`;
                showScreen("quizScreen");
                displayQuestion();
            }

            function isCurrentUserRoomParticipant(room) {
                return Boolean(
                    currentUser &&
                        room?.players?.some(
                            (player) =>
                                player.userId === currentUser.id ||
                                player.id === currentUser.id,
                        ),
                );
            }

            function clearWaitingRecoveryTimer() {
                if (waitingRecoveryTimer) {
                    clearTimeout(waitingRecoveryTimer);
                    waitingRecoveryTimer = null;
                }
            }

            function startWaitingRecoveryTimer() {
                if (waitingRecoveryTimer) return;

                const queue = document.getElementById("answerQueue");
                const isWaitingText = (value) =>
                    value === "Waiting for other players..." ||
                    value === "Time is up. Waiting for other players...";
                if (
                    !currentRoomCode ||
                    !currentUser ||
                    document.getElementById("quizScreen").style.display ===
                        "none" ||
                    !isWaitingText(queue?.textContent)
                ) {
                    return;
                }

                const roomCode = currentRoomCode;
                const waitingQuestionOrder = questionOrder;

                waitingRecoveryTimer = setTimeout(async () => {
                    waitingRecoveryTimer = null;
                    const currentQueue = document.getElementById("answerQueue");
                    if (
                        currentRoomCode !== roomCode ||
                        document.getElementById("quizScreen").style.display ===
                            "none" ||
                        !isWaitingText(currentQueue?.textContent)
                    ) {
                        return;
                    }

                    try {
                        const data = await api(
                            "GET",
                            `/api/rooms/${roomCode}/state`,
                        );
                        if (!data.success || !data.room) return;
                        if (!isCurrentUserRoomParticipant(data.room)) {
                            clearRoomReference();
                            enterLobby();
                            return;
                        }

                        if (data.finished && data.summary) {
                            showSummary(data.summary);
                            return;
                        }

                        if (!data.inGame || !data.gameState) return;

                        if (
                            data.gameState.questionNumber >
                            waitingQuestionOrder
                        ) {
                            handleNextQuestion({
                                questions: data.gameState.questions,
                                questionNumber: data.gameState.questionNumber,
                                totalQuestions: data.gameState.totalQuestions,
                                resultMode: data.gameState.resultMode,
                                timePerQuestionSeconds:
                                    data.gameState.timePerQuestionSeconds,
                                questionStartedAt:
                                    data.gameState.questionStartedAt,
                            });
                            return;
                        }

                        if (
                            data.gameState.questionNumber ===
                                waitingQuestionOrder &&
                            data.gameState.transition
                        ) {
                            startTransitionCountdown(
                                data.gameState.transition,
                            );
                            return;
                        }

                        startWaitingRecoveryTimer();
                    } catch (_) {
                        startWaitingRecoveryTimer();
                    }
                }, 10000);
            }

            function setAnswerControlsDisabled(disabled) {
                document
                    .querySelectorAll(".option-btn, .submit-answer-btn")
                    .forEach((button) => {
                        button.classList.toggle("disabled", disabled);
                        button.disabled = disabled;
                    });
                const fillInput = document.getElementById("fillAnswerInput");
                if (fillInput) fillInput.disabled = disabled;
            }

            function hasQuestionTimerExpired() {
                if (!timePerQuestionSeconds || !currentQuestionStartedAt)
                    return false;
                const started = Date.parse(currentQuestionStartedAt);
                if (!Number.isFinite(started)) return false;
                return Date.now() >= started + timePerQuestionSeconds * 1000;
            }

            function lockAnswerInput(message) {
                questionInputLocked = true;
                answerSubmitted = true;
                stopQuestionTimer();
                setAnswerControlsDisabled(true);
                if (message) {
                    document.getElementById("answerQueue").textContent =
                        message;
                }
            }

            function stopQuestionTimer() {
                if (questionTimerInterval) {
                    clearInterval(questionTimerInterval);
                    questionTimerInterval = null;
                }
                const timer = document.getElementById("questionTimer");
                if (timer) timer.style.display = "none";
            }

            function startQuestionTimer() {
