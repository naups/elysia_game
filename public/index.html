                            startTransitionCountdown(
                                data.gameState.transition,
                            );
                            return;
                        }

                        startWaitingRecoveryTimer();
                    } catch (_) {
                        startWaitingRecoveryTimer();
                    }
                }, 10000);
            }

            function setAnswerControlsDisabled(disabled) {
                document
                    .querySelectorAll(".option-btn, .submit-answer-btn")
                    .forEach((button) => {
                        button.classList.toggle("disabled", disabled);
                        button.disabled = disabled;
                    });
                const fillInput = document.getElementById("fillAnswerInput");
                if (fillInput) fillInput.disabled = disabled;
            }

            function hasQuestionTimerExpired() {
                if (!timePerQuestionSeconds || !currentQuestionStartedAt)
                    return false;
                const started = Date.parse(currentQuestionStartedAt);
                if (!Number.isFinite(started)) return false;
                return Date.now() >= started + timePerQuestionSeconds * 1000;
            }

            function lockAnswerInput(message) {
                questionInputLocked = true;
                answerSubmitted = true;
                stopQuestionTimer();
                setAnswerControlsDisabled(true);
                if (message) {
                    document.getElementById("answerQueue").textContent =
                        message;
                }
            }

            function stopQuestionTimer() {
                if (questionTimerInterval) {
                    clearInterval(questionTimerInterval);
                    questionTimerInterval = null;
                }
                const timer = document.getElementById("questionTimer");
                if (timer) timer.style.display = "none";
            }

            function startQuestionTimer() {
                stopQuestionTimer();
                if (!timePerQuestionSeconds || !currentQuestionStartedAt) return;

                const timer = document.getElementById("questionTimer");
                const fill = document.getElementById("timerFill");
                const text = document.getElementById("timerText");
                const started = Date.parse(currentQuestionStartedAt);
                if (!Number.isFinite(started)) return;

                const endTime = started + timePerQuestionSeconds * 1000;
                timer.style.display = "block";

                const render = () => {
                    const remainingMs = Math.max(0, endTime - Date.now());
                    const pct = Math.max(
                        0,
                        Math.min(100, (remainingMs / (timePerQuestionSeconds * 1000)) * 100),
                    );
                    fill.style.width = `${pct}%`;
                    text.textContent = `${Math.ceil(remainingMs / 1000)}s`;
                    if (remainingMs <= 0) {
                        handleQuestionTimeExpired();
                    }
                };

                render();
                questionTimerInterval = setInterval(render, 250);
            }

            function handleQuestionTimeExpired() {
                if (answerSubmitted || !currentRoomCode || !currentQuestion)
                    return;
                const queue = document.getElementById("answerQueue");
                lockAnswerInput("Time is up. Waiting for other players...");
                startWaitingRecoveryTimer();
            }

            function hideLeaderboardOverlay() {
                const overlay = document.getElementById("leaderboardOverlay");
                if (!overlay) return;
                overlay.classList.remove("show");
                overlay.innerHTML = "";
            }

            async function showLeaderboardOverlay(transition) {
                if (!currentRoomCode) return;
                try {
                    const data = await api(
                        "GET",
                        `/api/rooms/${currentRoomCode}/leaderboard`,
                    );
                    if (!data.success) return;
                    const overlay = document.getElementById("leaderboardOverlay");
                    const rows = data.leaderboard.slice(0, 5);
                    overlay.innerHTML = `
                        <h3>Leaderboard</h3>
                        ${rows
                            .map(
                                (player) => `
                                    <div class="leaderboard-row ${player.isCurrentUser ? "me" : ""}">
                                        <span>#${player.rank} ${escapeHtml(player.username)}</span>
                                        <strong>${player.score} pts${player.streak ? ` | x${player.streak}` : ""}</strong>
                                    </div>
                                `,
                            )
                            .join("")}
                    `;
                    overlay.classList.add("show");
                    if (transition?.gameOver) {
                        document.getElementById("answerQueue").textContent =
                            "Final results are loading...";
                    }
                } catch (error) {
                    console.error("Leaderboard error:", error);
                }
            }

            function playFeedbackTone(isCorrect) {
                const AudioContext =
                    window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                try {
                    const ctx = new AudioContext();
                    const oscillator = ctx.createOscillator();
                    const gain = ctx.createGain();
                    oscillator.frequency.value = isCorrect ? 660 : 220;
                    oscillator.type = "sine";
                    gain.gain.setValueAtTime(0.08, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(
                        0.001,
                        ctx.currentTime + 0.18,
                    );
                    oscillator.connect(gain);
                    gain.connect(ctx.destination);
                    oscillator.start();
                    oscillator.stop(ctx.currentTime + 0.18);
                } catch (_) {}
            }

            function showConfetti() {
                const layer = document.getElementById("confettiLayer");
                if (!layer) return;
                layer.innerHTML = "";
                const colors = ["#4caf50", "#f9a825", "#ef5350", "#667eea"];
                for (let i = 0; i < 28; i++) {
                    const piece = document.createElement("span");
                    piece.className = "confetti-piece";
                    piece.style.left = `${Math.random() * 100}%`;
                    piece.style.background = colors[i % colors.length];
                    piece.style.animationDelay = `${Math.random() * 0.2}s`;
                    layer.appendChild(piece);
                }
                setTimeout(() => {
                    layer.innerHTML = "";
                }, 1300);
            }

            function applyFeedbackMotion(isCorrect) {
                const quiz = document.getElementById("quizScreen");
                quiz.classList.remove("quiz-feedback-pulse", "quiz-feedback-shake");
                void quiz.offsetWidth;
                quiz.classList.add(
                    isCorrect ? "quiz-feedback-pulse" : "quiz-feedback-shake",
                );
            }

            function displayQuestion() {
                if (!currentQuestion) return;
                document.getElementById("questionText").textContent =
                    currentQuestion.text;
                const container = document.getElementById("optionsContainer");
                container.innerHTML = "";
                document.getElementById("feedback").className = "feedback";
                document.getElementById("feedback").textContent = "";
                document.getElementById("answerQueue").textContent = "";

                if (currentQuestion.type === "fill_blank") {
                    const input = document.createElement("input");
                    input.type = "text";
                    input.className = "fill-answer";
                    input.id = "fillAnswerInput";
                    input.placeholder = "Type your answer";
                    input.addEventListener("keydown", (event) => {
                        if (event.key === "Enter") {
                            selectAnswer(input.value, null);
                        }
                    });
                    const submit = document.createElement("button");
                    submit.className = "btn btn-primary submit-answer-btn";
                    submit.textContent = "Submit Answer";
                    submit.onclick = () => selectAnswer(input.value, submit);
                    container.appendChild(input);
                    container.appendChild(submit);
                    input.focus();
                    startQuestionTimer();
                    return;
                }

                const options = currentQuestion.options || [];
                options.forEach((option) => {
                    const btn = document.createElement("button");
                    btn.className = "option-btn";
                    btn.textContent = option;
                    btn.onclick = () => selectAnswer(option, btn);
                    container.appendChild(btn);
                });
                startQuestionTimer();
            }

            function stopTransitionCountdown() {
                if (transitionCountdownTimer) {
                    clearInterval(transitionCountdownTimer);
                    transitionCountdownTimer = null;
                }
            }

            function startTransitionCountdown(data) {
                stopTransitionCountdown();
                stopQuestionTimer();
                clearWaitingRecoveryTimer();
                const queue = document.getElementById("answerQueue");
                if (!queue) return;
                const advanceTime = Date.parse(data.advanceAt);
                const fallbackEnd =
                    Date.now() + (data.delaySeconds ?? 10) * 1000;
                const endTime = Number.isFinite(advanceTime)
                    ? advanceTime
                    : fallbackEnd;

                const render = () => {
                    const remaining = Math.max(
                        0,
                        Math.ceil((endTime - Date.now()) / 1000),
                    );
                    queue.textContent = data.gameOver
                        ? `Results in ${remaining}s...`
                        : `Next question in ${remaining}s...`;
                    if (remaining <= 0) stopTransitionCountdown();
                };

                render();
                showLeaderboardOverlay(data);
                transitionCountdownTimer = setInterval(render, 250);
            }

            async function selectAnswer(answer, btn, isAutomatic = false) {
                if (answerSubmitted || questionInputLocked) return;
                if (hasQuestionTimerExpired()) {
                    lockAnswerInput("Time is up. Waiting for other players...");
                    startWaitingRecoveryTimer();
                    return;
                }
                answerSubmitted = true;
                questionInputLocked = true;
                stopQuestionTimer();
                const buttons = document.querySelectorAll(
                    ".option-btn, .submit-answer-btn",
                );
                setAnswerControlsDisabled(true);

                try {
                    const data = await api(
                        "POST",
                        `/api/rooms/${currentRoomCode}/answer`,
                        {
                            questionId: currentQuestion.id,
                            answer,
                            questionOrder,
                        },
                    );

                    if (!data.success) {
                        if (data.message === "Question time has ended") {
                            lockAnswerInput(
                                "Time is up. Waiting for other players...",
                            );
                            startWaitingRecoveryTimer();
                            return;
                        }
                        document.getElementById("answerQueue").textContent =
                            data.message || "Error submitting answer";
                        answerSubmitted = false;
                        questionInputLocked = false;
                        setAnswerControlsDisabled(false);
                        return;
                    }

                    // Show instant feedback if mode is instant
                    if (
                        resultMode === "instant" &&
                        data.isCorrect !== undefined
                    ) {
                        const feedback = document.getElementById("feedback");
                        buttons.forEach((b) => {
                            if (b.textContent === data.correctAnswer) {
                                b.classList.add("correct");
                            } else if (b === btn && !data.isCorrect) {
                                b.classList.add("wrong");
                            }
                        });
                        if (data.isCorrect) {
                            feedback.className = "feedback correct";
                            feedback.textContent = "✅ Correct! +10 points";
                        } else {
                            feedback.className = "feedback wrong";
                            feedback.textContent = `❌ Wrong! Answer: ${data.correctAnswer}`;
                        }
                        const points =
                            data.pointsAwarded ?? (data.isCorrect ? 10 : 0);
                        if (data.isCorrect) {
                            feedback.textContent =
                                `Correct! +${points} points` +
                                (data.streakBonus
                                    ? ` | Streak x${data.streak} +${data.streakBonus}`
                                    : "");
                            showConfetti();
                        } else {
                            feedback.textContent = isAutomatic
                                ? `Time is up. Answer: ${data.correctAnswer}`
                                : `Wrong! Answer: ${data.correctAnswer}`;
                        }
                        playFeedbackTone(data.isCorrect);
                        applyFeedbackMotion(data.isCorrect);
                        document.getElementById("headerScore").textContent =
                            `Score: ${data.score}`;
                    }

                    if (data.nextQuestionScheduled || data.gameOverScheduled) {
                        startTransitionCountdown({
                            delaySeconds: data.delaySeconds,
                            advanceAt: data.advanceAt,
                            gameOver: data.gameOverScheduled,
                        });
                    } else if (data.nextQuestion) {
                        setTimeout(() => {
                            handleNextQuestion(data.nextQuestion);
                        }, 1500);
                    } else if (data.gameOver) {
                        // Game over — wait for WS summary
                        document.getElementById("answerQueue").textContent =
                            "Game over! Loading results...";
                    } else {
                        // Waiting for other players
                        document.getElementById("answerQueue").textContent =
                            "Waiting for other players...";
                        startWaitingRecoveryTimer();
                    }
                } catch (e) {
                    console.error("Answer error:", e);
                }
            }

            function handleAnswerResult(data) {
                if (resultMode !== "instant") return;

                // For other players' results, highlight their correct answer
                if (data.userId !== currentUser.id) {
                    // Just show that another player answered
                    return;
                }

                // Skip if REST response already showed feedback
                // (buttons already disabled means we already answered)
                const buttons = document.querySelectorAll(
                    ".option-btn.disabled",
                );
                if (buttons.length > 0) return;

                // Fallback: show feedback from WS if REST didn't provide it
                const allButtons = document.querySelectorAll(".option-btn");
                allButtons.forEach((b) => {
                    if (b.textContent === data.correctAnswer) {
                        b.classList.add("correct");
                    }
                    b.classList.add("disabled");
                });

                const feedback = document.getElementById("feedback");
                if (data.isCorrect) {
                    feedback.className = "feedback correct";
                    feedback.textContent = "✅ Correct! +10 points";
                } else {
                    feedback.className = "feedback wrong";
                    feedback.textContent = `❌ Wrong! Answer: ${data.correctAnswer}`;
                }
                playFeedbackTone(data.isCorrect);
                applyFeedbackMotion(data.isCorrect);
                if (data.isCorrect) showConfetti();
                document.getElementById("headerScore").textContent =
                    `Score: ${data.score}`;
            }

            // ═══════════════════════════════════════════════════════════
            //  SUMMARY
            // ═══════════════════════════════════════════════════════════

            function renderPodium(summary) {
                const container = document.getElementById("podiumContainer");
                const top = summary.slice(0, 3);
                if (top.length === 0) {
                    container.innerHTML = "";
                    return;
                }

                const order = [top[1], top[0], top[2]].filter(Boolean);
                const placeClass = { 1: "first", 2: "second", 3: "third" };
                const placeLabel = { 1: "1st", 2: "2nd", 3: "3rd" };
                const heights = { 1: 130, 2: 95, 3: 70 };

                container.innerHTML = `
                    <div class="podium">
                        ${order
                            .map(
                                (player) => `
                                    <div class="podium-place ${placeClass[player.rank]}">
                                        <div class="podium-player">${escapeHtml(player.username)}<br>${player.score} pts</div>
                                        <div class="podium-bar" data-height="${heights[player.rank]}">${placeLabel[player.rank]}</div>
                                    </div>
                                `,
                            )
                            .join("")}
                    </div>
                `;

                setTimeout(() => {
                    document
                        .querySelectorAll(".podium-bar")
                        .forEach((bar) => {
                            bar.style.height = `${bar.dataset.height}px`;
                        });
                }, 100);
            }

            function showSummary(summary) {
                stopRoomPolling();
                stopTransitionCountdown();
                stopQuestionTimer();
                clearWaitingRecoveryTimer();
                hideLeaderboardOverlay();
                if (currentRoomCode) persistRoomCode(currentRoomCode);
                showScreen("summaryScreen");
                showScoreBar(false);

                // Winner card
                const winner = summary[0];
                const winnerHtml = winner
                    ? `
                    <div class="winner-card">
                        <div class="trophy">🏆</div>
                        <div class="winner-name">${escapeHtml(winner.username)}</div>
                        <div>${winner.score} points · ${winner.accuracy}% accuracy</div>
                    </div>
                `
                    : "";
                document.getElementById("winnerCard").innerHTML = winnerHtml;
                renderPodium(summary);
                if (summary.length > 0) showConfetti();

                // Ranking table
                const tbody = document.getElementById("rankingBody");
                tbody.innerHTML = "";
                summary.forEach((p) => {
                    const tr = document.createElement("tr");
                    const medal =
                        p.rank === 1
                            ? "🥇"
                            : p.rank === 2
                              ? "🥈"
                              : p.rank === 3
                                ? "🥉"
                                : p.rank;
                    tr.innerHTML = `
                        <td class="rank-number">${medal}</td>
                        <td>
                            <img src="${escapeHtml(p.avatar)}" style="width:28px;height:28px;border-radius:50%;vertical-align:middle;margin-right:6px" />
                            ${escapeHtml(p.username)}
                        </td>
                        <td>${p.score}</td>
                        <td>
                            ${p.accuracy}%
                            <span class="accuracy-bar" style="width:${p.accuracy * 0.8}px"></span>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });

                // Detail breakdown
                const detailSection = document.getElementById("detailSection");
                detailSection.innerHTML = "";
                summary.forEach((p) => {
                    if (p.answers.length === 0) return;
                    const div = document.createElement("div");
                    div.innerHTML = `
                        <button class="detail-toggle" onclick="this.nextElementSibling.classList.toggle('show')">
                            &gt; ${escapeHtml(p.username)}'s answers
                        </button>
                        <div class="detail-list">
                            ${p.answers
                                .map(
                                    (a, i) => `
                                <div class="detail-item ${a.isCorrect ? "correct" : "wrong"}">
                                    ${i + 1}. ${escapeHtml(a.questionText)}<br>
                                    &nbsp;&nbsp;&nbsp;Your: ${escapeHtml(a.userAnswer)} ${a.isCorrect ? "Correct" : `Wrong (Correct: ${escapeHtml(a.correctAnswer)})`}
                                </div>
                            `,
                                )
                                .join("")}
                        </div>
                    `;
                    detailSection.appendChild(div);
                });

                currentQuestion = null;
            }

            // ═══════════════════════════════════════════════════════════
            //  SOLO MODE (Legacy)
            // ═══════════════════════════════════════════════════════════

            async function startSoloQuiz() {
                questionOrder = 0;
                totalQuestions = 5;
                showScoreBar(true);
                await getNextSoloQuestion();
            }

            async function getNextSoloQuestion() {
                showScreen("loadingScreen");
                try {
                    const data = await api("GET", "/api/questions/next");
                    if (data.success) {
                        currentQuestion = data.question;
                        document.getElementById("headerScore").textContent =
                            `Score: ${data.currentScore}`;
                        questionOrder++;
                        updateProgress();
                        showScreen("quizScreen");
                        displaySoloQuestion();
                    } else {
                        showScreen("lobbyScreen");
                    }
                } catch (e) {
                    showScreen("lobbyScreen");
                }
            }

            function displaySoloQuestion() {
                if (!currentQuestion) return;
                document.getElementById("questionText").textContent =
                    currentQuestion.text;
                const container = document.getElementById("optionsContainer");
                container.innerHTML = "";
                document.getElementById("feedback").className = "feedback";
                document.getElementById("feedback").textContent = "";

                currentQuestion.options.forEach((option) => {
                    const btn = document.createElement("button");
                    btn.className = "option-btn";
                    btn.textContent = option;
                    btn.onclick = () => selectSoloAnswer(option, btn);
                    container.appendChild(btn);
                });
            }

            async function selectSoloAnswer(answer, btn) {
                const buttons = document.querySelectorAll(".option-btn");
                buttons.forEach((b) => b.classList.add("disabled"));

                try {
                    const data = await api("POST", "/api/answer", {
                        questionId: currentQuestion.id,
                        userAnswer: answer,
                    });

                    if (data.success) {
                        buttons.forEach((b) => {
                            if (b.textContent === data.correctAnswer)
                                b.classList.add("correct");
                            else if (b === btn && !data.isCorrect)
                                b.classList.add("wrong");
                        });

                        const feedback = document.getElementById("feedback");
                        if (data.isCorrect) {
                            feedback.className = "feedback correct";
                            feedback.textContent = "✅ Correct! +10 points";
                        } else {
                            feedback.className = "feedback wrong";
                            feedback.textContent = `❌ Wrong! Answer: ${data.correctAnswer}`;
                        }

                        document.getElementById("headerScore").textContent =
                            `Score: ${data.score}`;
                        questionOrder++;
                        updateProgress();

                        setTimeout(() => {
                            if (questionOrder >= totalQuestions) {
                                showSoloResults(data.score);
                            } else {
                                getNextSoloQuestion();
                            }
                        }, 1500);
                    }
                } catch (e) {
                    console.error("Answer error:", e);
                }
            }

            function showSoloResults(score) {
                document.getElementById("finalScore").textContent = score;
                let msg = "";
                if (score >= 40) msg = "🏆 Amazing! You're a trivia master!";
                else if (score >= 30) msg = "🌟 Great job!";
                else if (score >= 20) msg = "👍 Good effort!";
                else msg = "💪 Keep trying!";
                document.getElementById("resultMessage").textContent = msg;
                showScreen("resultScreen");
            }

            // ═══════════════════════════════════════════════════════════
            //  NAVIGATION HELPERS
            // ═══════════════════════════════════════════════════════════

            function backToLobby() {
                const roomCodeToKeep = currentRoomCode || getSavedRoomCode();
                stopRoomPolling();
                stopTransitionCountdown();
                stopQuestionTimer();
                hideLeaderboardOverlay();
                clearWaitingRecoveryTimer();
                if (roomCodeToKeep) persistRoomCode(roomCodeToKeep);
                document.getElementById("winnerCard").innerHTML = "";
                document.getElementById("podiumContainer").innerHTML = "";
                document.getElementById("rankingBody").innerHTML = "";
                document.getElementById("detailSection").innerHTML = "";
                currentQuestion = null;
                questionOrder = 0;
                answerSubmitted = false;
                enterLobby();
            }

            // Enter key for login
            document
                .getElementById("usernameInput")
                .addEventListener("keypress", (e) => {
                    if (e.key === "Enter") registerUser();
                });

            // Enter key for join room
            document
                .getElementById("roomCodeInput")
                .addEventListener("keypress", (e) => {
                    if (e.key === "Enter") joinRoom();
                });

            // ═══════════════════════════════════════════════════════════
            //  INIT — Check session on load (reconnection)
            // ═══════════════════════════════════════════════════════════

            window.onload = async () => {
                const valid = await validateSession();
                if (valid) {
                    const savedAvatar = localStorage.getItem("userAvatar");
                    if (savedAvatar) currentUser.avatar = savedAvatar;

                    document.getElementById("userAvatar").src =
                        currentUser.avatar ||
                        `https://api.dicebear.com/7.x/thumbs/svg?seed=${encodeURIComponent(currentUser.username)}`;
                    document.getElementById("userName").textContent =
                        currentUser.username;
                    showUserHeader(true);

                    const savedRoom = getSavedRoomCode();
                    if (savedRoom) {
                        await restoreRoomFromCode(savedRoom);
                    } else {
                        enterLobby();
                    }
                } else {
                    showScreen("loginScreen");
                }
            };
        </script>
    </body>
</html>
