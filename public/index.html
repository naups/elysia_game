<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Trivia Quiz — Multiplayer</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            body {
                font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                min-height: 100vh;
                display: flex;
                justify-content: center;
                align-items: center;
                padding: 20px;
            }
            .container {
                background: white;
                border-radius: 20px;
                box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
                max-width: 700px;
                width: 100%;
                overflow: hidden;
            }
            .header {
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                color: white;
                padding: 20px;
                text-align: center;
                position: relative;
            }
            .header h1 {
                font-size: 1.8em;
                margin-bottom: 5px;
            }
            .header .score {
                font-size: 1.2em;
                opacity: 0.9;
            }
            .header .user-info {
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 10px;
                margin-top: 8px;
            }
            .header .user-info img {
                width: 32px;
                height: 32px;
                border-radius: 50%;
                border: 2px solid white;
            }
            .logout-btn {
                position: absolute;
                top: 15px;
                right: 15px;
                background: rgba(255, 255, 255, 0.2);
                border: none;
                color: white;
                padding: 6px 14px;
                border-radius: 8px;
                cursor: pointer;
                font-size: 14px;
            }
            .logout-btn:hover {
                background: rgba(255, 255, 255, 0.35);
            }
            .progress-bar {
                background: #e0e0e0;
                height: 8px;
                margin-top: 10px;
                border-radius: 4px;
                overflow: hidden;
            }
            .progress-fill {
                background: #4caf50;
                height: 100%;
                transition: width 0.3s ease;
            }
            .timer-wrap {
                display: none;
                margin-bottom: 16px;
            }
            .timer-meta {
                display: flex;
                justify-content: space-between;
                color: #666;
                font-size: 13px;
                margin-bottom: 6px;
            }
            .timer-bar {
                height: 10px;
                background: #f1f1f1;
                border-radius: 999px;
                overflow: hidden;
            }
            .timer-fill {
                width: 100%;
                height: 100%;
                background: linear-gradient(90deg, #2e7d32, #f9a825, #c62828);
                transition: width 0.2s linear;
            }
            .content {
                padding: 30px;
            }
            .screen {
                display: none;
            }
            .screen.active {
                display: block;
            }
            h2 {
                color: #333;
                margin-bottom: 20px;
                text-align: center;
            }
            input[type="text"] {
                width: 100%;
                padding: 15px;
                font-size: 16px;
                border: 2px solid #ddd;
                border-radius: 10px;
                margin-bottom: 15px;
                transition: border-color 0.3s;
            }
            input[type="text"]:focus {
                outline: none;
                border-color: #667eea;
            }
            .btn {
                width: 100%;
                padding: 15px;
                font-size: 16px;
                border: none;
                border-radius: 10px;
                cursor: pointer;
                transition:
                    transform 0.2s,
                    box-shadow 0.2s;
                margin-bottom: 10px;
            }
            .btn:hover {
                transform: translateY(-2px);
            }
            .btn-primary {
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                color: white;
            }
            .btn-primary:hover {
                box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
            }
            .btn-success {
                background: linear-gradient(135deg, #4caf50 0%, #2e7d32 100%);
                color: white;
            }
            .btn-success:hover {
                box-shadow: 0 5px 20px rgba(76, 175, 80, 0.4);
            }
            .btn-danger {
                background: linear-gradient(135deg, #ef5350 0%, #c62828 100%);
                color: white;
            }
            .btn-secondary {
                background: #e0e0e0;
                color: #333;
            }
            .btn-small {
                width: auto;
                padding: 8px 16px;
                font-size: 14px;
            }
            .error-msg {
                color: #ef5350;
                text-align: center;
                margin-top: 10px;
                min-height: 20px;
            }
            /* Login */
            .login-screen {
                text-align: center;
            }
            /* Lobby */
            .lobby-actions {
                display: flex;
                gap: 10px;
                margin-bottom: 20px;
            }
            .lobby-actions .btn {
                flex: 1;
            }
            .active-room-panel {
                background: #f5f5ff;
                border: 1px solid #d9ddff;
                border-radius: 8px;
                padding: 14px;
                margin-bottom: 15px;
                text-align: center;
            }
            .active-room-panel strong {
                color: #667eea;
                letter-spacing: 2px;
            }
            .active-room-actions {
                display: flex;
                gap: 8px;
                justify-content: center;
                flex-wrap: wrap;
                margin-top: 10px;
            }
            /* Room */
            .room-code {
                text-align: center;
                font-size: 2em;
                font-weight: bold;
                color: #667eea;
                letter-spacing: 8px;
                margin: 15px 0;
                padding: 15px;
                background: #f5f5ff;
                border-radius: 10px;
            }
            .player-list {
                list-style: none;
                margin: 15px 0;
            }
            .player-item {
                display: flex;
                align-items: center;
                padding: 12px;
                border-bottom: 1px solid #eee;
                gap: 12px;
            }
            .player-item:last-child {
                border-bottom: none;
            }
            .player-item img {
                width: 40px;
                height: 40px;
                border-radius: 50%;
            }
            .player-name {
                flex: 1;
                font-weight: 600;
            }
            .player-badge {
                font-size: 12px;
                padding: 3px 8px;
                border-radius: 12px;
                font-weight: 600;
            }
            .badge-master {
                background: #fff3e0;
                color: #e65100;
            }
            .badge-ready {
                background: #e8f5e9;
                color: #2e7d32;
            }
            .badge-not-ready {
                background: #ffebee;
                color: #c62828;
            }
            .kick-btn {
                background: #ef5350;
                color: white;
                border: none;
                padding: 5px 10px;
                border-radius: 6px;
                cursor: pointer;
                font-size: 12px;
            }
            /* Settings */
            .settings-panel {
                background: #f9f9f9;
                border-radius: 12px;
                padding: 20px;
                margin: 15px 0;
            }
            .settings-panel h3 {
                margin-bottom: 15px;
                color: #555;
            }
            .setting-row {
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 12px;
            }
            .setting-row label {
                font-weight: 500;
                color: #555;
            }
            .setting-row select,
            .setting-row input[type="number"] {
                padding: 8px 12px;
                border: 2px solid #ddd;
                border-radius: 8px;
                font-size: 14px;
            }
            /* Quiz */
            .question-text {
                font-size: 1.3em;
                font-weight: 600;
                color: #333;
                margin-bottom: 20px;
                text-align: center;
            }
            .options {
                display: flex;
                flex-direction: column;
                gap: 10px;
            }
            .option-btn {
                padding: 15px 20px;
                font-size: 16px;
                border: 2px solid #ddd;
                border-radius: 10px;
                background: white;
                cursor: pointer;
                text-align: left;
                transition: all 0.2s;
            }
            .option-btn:hover:not(.disabled) {
                border-color: #667eea;
                background: #f5f5ff;
            }
            .option-btn.correct {
                background: #e8f5e9;
                border-color: #4caf50;
                color: #2e7d32;
            }
            .option-btn.wrong {
                background: #ffebee;
                border-color: #ef5350;
                color: #c62828;
            }
            .option-btn.disabled {
                cursor: default;
                opacity: 0.7;
            }
            .fill-answer {
                margin-bottom: 10px;
            }
            .quiz-feedback-pulse {
                animation: correctPulse 0.45s ease;
            }
            .quiz-feedback-shake {
                animation: wrongShake 0.35s ease;
            }
            .feedback {
                text-align: center;
                padding: 12px;
                border-radius: 10px;
                margin-top: 15px;
                font-weight: 600;
                min-height: 45px;
            }
            .feedback.correct {
                background: #e8f5e9;
                color: #2e7d32;
            }
            .feedback.wrong {
                background: #ffebee;
                color: #c62828;
            }
            .answer-queue {
                text-align: center;
                margin-top: 15px;
                color: #888;
                font-size: 14px;
            }
            .leaderboard-overlay {
                display: none;
                background: #111827;
                color: white;
                border-radius: 12px;
                padding: 16px;
                margin: 16px 0;
                box-shadow: 0 10px 30px rgba(17, 24, 39, 0.25);
            }
            .leaderboard-overlay.show {
                display: block;
            }
            .leaderboard-overlay h3 {
                margin-bottom: 10px;
                text-align: center;
            }
            .leaderboard-row {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 10px;
                padding: 8px 10px;
                border-radius: 8px;
                background: rgba(255, 255, 255, 0.08);
                margin-bottom: 6px;
            }
            .leaderboard-row.me {
                background: rgba(102, 126, 234, 0.55);
            }
            .confetti-layer {
                pointer-events: none;
                position: fixed;
                inset: 0;
                overflow: hidden;
                z-index: 20;
            }
            .confetti-piece {
                position: absolute;
                top: -12px;
                width: 8px;
                height: 14px;
                animation: confettiDrop 1s linear forwards;
            }
            /* Summary */
            .summary-screen h2 {
                margin-bottom: 10px;
            }
            .podium {
                display: flex;
                align-items: flex-end;
                justify-content: center;
                gap: 12px;
                min-height: 180px;
                margin: 16px 0 20px;
            }
            .podium-place {
                flex: 1;
                text-align: center;
                max-width: 150px;
            }
            .podium-player {
                font-weight: 700;
                color: #333;
                margin-bottom: 8px;
                min-height: 38px;
            }
            .podium-bar {
                height: 0;
                border-radius: 8px 8px 0 0;
                color: white;
                display: flex;
                align-items: flex-end;
                justify-content: center;
                padding: 10px 6px;
                font-weight: 700;
                transition: height 0.9s ease-out;
            }
            .podium-place.first .podium-bar {
                background: #f9a825;
            }
            .podium-place.second .podium-bar {
                background: #78909c;
            }
            .podium-place.third .podium-bar {
                background: #8d6e63;
            }
            .winner-card {
                text-align: center;
                padding: 20px;
                background: linear-gradient(135deg, #fff9c4 0%, #fff176 100%);
                border-radius: 15px;
                margin-bottom: 20px;
            }
            .winner-card .trophy {
                font-size: 3em;
            }
            .winner-card .winner-name {
                font-size: 1.5em;
                font-weight: bold;
                margin: 5px 0;
            }
            .ranking-table {
                width: 100%;
                border-collapse: collapse;
                margin: 15px 0;
            }
            .ranking-table th,
            .ranking-table td {
                padding: 10px;
                text-align: left;
                border-bottom: 1px solid #eee;
            }
            .ranking-table th {
                color: #888;
                font-size: 13px;
            }
            .rank-number {
                font-weight: bold;
                font-size: 1.2em;
                width: 30px;
            }
            .accuracy-bar {
                display: inline-block;
                height: 8px;
                border-radius: 4px;
                background: #4caf50;
                margin-left: 8px;
                vertical-align: middle;
            }
            .detail-toggle {
                background: none;
                border: none;
                color: #667eea;
                cursor: pointer;
                font-size: 14px;
            }
            .detail-list {
                display: none;
                margin: 5px 0 10px 30px;
                font-size: 14px;
            }
            .detail-list.show {
                display: block;
            }
            .detail-item {
                padding: 4px 0;
            }
            .detail-item.correct {
                color: #2e7d32;
            }
            .detail-item.wrong {
                color: #c62828;
            }
            /* Custom Questions */
            .custom-q-form {
                background: #f5f5ff;
                padding: 15px;
                border-radius: 10px;
                margin: 10px 0;
            }
            .custom-q-form input,
            .custom-q-form select {
                width: 100%;
                padding: 10px;
                margin-bottom: 8px;
                border: 2px solid #ddd;
                border-radius: 8px;
            }
            /* Loading */
            .loading {
                display: flex;
                justify-content: center;
                align-items: center;
                padding: 40px;
            }
            .spinner {
                width: 40px;
                height: 40px;
                border: 4px solid #e0e0e0;
                border-top: 4px solid #667eea;
                border-radius: 50%;
                animation: spin 0.8s linear infinite;
            }
            @keyframes spin {
                to {
                    transform: rotate(360deg);
                }
            }
            @keyframes correctPulse {
                0% {
                    transform: scale(1);
                }
                50% {
                    transform: scale(1.03);
                }
                100% {
                    transform: scale(1);
                }
            }
            @keyframes wrongShake {
                0%,
                100% {
                    transform: translateX(0);
                }
                25% {
                    transform: translateX(-8px);
                }
                75% {
                    transform: translateX(8px);
                }
            }
            @keyframes confettiDrop {
                to {
                    transform: translateY(105vh) rotate(360deg);
                    opacity: 0;
                }
            }
            .hidden {
                display: none !important;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="header">
                <h1>🎮 Trivia Quiz</h1>
                <div class="score" id="headerScore" style="display: none">
                    Score: 0
                </div>
                <div class="user-info" id="userInfo" style="display: none">
                    <img id="userAvatar" src="" alt="avatar" />
                    <span id="userName"></span>
                </div>
                <button
                    class="logout-btn"
                    id="logoutBtn"
                    style="display: none"
                    onclick="logout()"
                >
                    Logout
                </button>
                <div
                    class="progress-bar"
                    id="progressBar"
                    style="display: none"
                >
                    <div
                        class="progress-fill"
                        id="progressFill"
                        style="width: 0%"
                    ></div>
                </div>
            </div>

            <div class="content">
                <!-- Login Screen -->
                <div id="loginScreen" class="screen login-screen active">
                    <h2>Welcome to Trivia Quiz!</h2>
                    <input
                        type="text"
                        id="usernameInput"
                        placeholder="Enter your username"
                        maxlength="50"
                    />
                    <button class="btn btn-primary" onclick="registerUser()">
                        Start Playing
                    </button>
                    <div id="loginError" class="error-msg"></div>
                </div>

                <!-- Lobby Screen -->
                <div id="lobbyScreen" class="screen">
                    <h2>🎯 Lobby</h2>
                    <div class="lobby-actions">
                        <button
                            class="btn btn-primary"
                            onclick="showCreateRoom()"
                        >
                            Create Room
                        </button>
                        <button
                            class="btn btn-secondary"
                            onclick="showJoinRoom()"
                        >
                            Join Room
                        </button>
                    </div>

                    <div id="activeRoomPanel" class="active-room-panel hidden">
                        <div>
                            Active room: <strong id="activeRoomCode">------</strong>
                        </div>
                        <div class="active-room-actions">
                            <button
                                class="btn btn-success btn-small"
                                onclick="returnToActiveRoom()"
                            >
                                Return to Room
                            </button>
                            <button
                                class="btn btn-danger btn-small hidden"
                                id="activeRoomDeleteBtn"
                                onclick="deleteSavedRoom()"
                            >
                                Delete Room
                            </button>
                        </div>
                    </div>

                    <!-- Join by code -->
                    <div id="joinForm" class="hidden">
                        <input
                            type="text"
                            id="roomCodeInput"
                            placeholder="Enter room code (e.g. ABC123)"
                            maxlength="6"
                            style="text-transform: uppercase"
                        />
                        <button class="btn btn-primary" onclick="joinRoom()">
                            Join
                        </button>
                    </div>

                    <!-- Create room settings -->
                    <div id="createForm" class="hidden">
                        <div class="settings-panel">
                            <h3>Room Settings</h3>
                            <div class="setting-row">
                                <label>Max Players</label>
                                <input
                                    type="number"
                                    id="setMaxPlayers"
                                    value="6"
                                    min="2"
                                    max="10"
                                />
                            </div>
                            <div class="setting-row">
                                <label>Questions</label>
                                <input
                                    type="number"
                                    id="setQuestionCount"
                                    value="5"
                                    min="3"
                                    max="20"
                                />
                            </div>
                            <div class="setting-row">
                                <label>Question Delay</label>
                                <input
                                    type="number"
                                    id="setQuestionDelay"
                                    value="10"
                                    min="0"
                                    max="60"
                                />
                            </div>
                            <div class="setting-row">
                                <label>Time per Question</label>
                                <input
                                    type="number"
                                    id="setTimePerQuestion"
                                    value="0"
                                    min="0"
                                    max="300"
                                />
                            </div>
                            <div class="setting-row">
                                <label>Idle Timeout</label>
                                <input
                                    type="number"
                                    id="setRoomIdleTimeout"
                                    value="1800"
                                    min="0"
                                    max="86400"
                                />
                            </div>
                            <div class="setting-row">
                                <label>Source</label>
                                <select
                                    id="setQuestionSource"
                                    onchange="toggleCustomQ()"
                                >
                                    <option value="database">Database</option>
                                    <option value="custom">Custom</option>
                                </select>
                            </div>
                            <div class="setting-row">
                                <label>Mode</label>
                                <select id="setQuestionMode">
                                    <option value="same_for_all">
                                        Same for All
                                    </option>
                                    <option value="random_per_player">
                                        Random per Player
                                    </option>
                                </select>
                            </div>
                            <div class="setting-row">
                                <label>Show Results</label>
                                <select id="setResultMode">
                                    <option value="instant">
                                        After Each Answer
                                    </option>
                                    <option value="end">At End</option>
                                </select>
                            </div>
                            <!-- Custom Questions Editor -->
                            <div id="customQEditor" class="hidden">
                                <h3 style="margin-top: 15px">
                                    Custom Questions
                                </h3>
                                <div id="customQList"></div>
                                <button
                                    class="btn btn-secondary btn-small"
                                    onclick="addCustomQuestion()"
                                    style="margin-top: 10px"
                                >
                                    + Add Question
                                </button>
                            </div>
                        </div>
                        <button class="btn btn-success" onclick="createRoom()">
                            Create Room
                        </button>
                    </div>

                    <div id="lobbyError" class="error-msg"></div>
                </div>

                <!-- Room Screen -->
                <div id="roomScreen" class="screen">
                    <h2>🏠 Room</h2>
                    <div class="room-code" id="roomCodeDisplay">------</div>
                    <p
                        style="
                            text-align: center;
                            color: #888;
                            margin-bottom: 10px;
                        "
                    >
                        Share this code with friends to join
                    </p>

                    <ul class="player-list" id="playerList"></ul>

                    <!-- Room Settings Display -->
                    <div class="settings-panel" id="roomSettingsDisplay">
                        <h3>Settings</h3>
                        <div id="roomSettingsInfo"></div>
                    </div>

                    <div style="display: flex; gap: 10px">
                        <button
                            class="btn btn-primary"
                            id="readyBtn"
                            onclick="toggleReady()"
                        >
                            Ready
                        </button>
                        <button
                            class="btn btn-success hidden"
                            id="startBtn"
                            onclick="startGame()"
                        >
                            Start Game
                        </button>
                    </div>
                    <div style="display: flex; gap: 10px; margin-top: 5px">
                        <button class="btn btn-secondary" onclick="backToLobby()">
                            Lobby
                        </button>
                        <button class="btn btn-secondary" onclick="leaveRoom()">
                            Leave Room
                        </button>
                    </div>
                    <div id="roomError" class="error-msg"></div>
                </div>

                <!-- Loading -->
                <div id="loadingScreen" class="screen loading">
                    <div class="spinner"></div>
                </div>

                <!-- Quiz Screen -->
                <div id="quizScreen" class="screen">
                    <div class="timer-wrap" id="questionTimer">
                        <div class="timer-meta">
                            <span>Time</span>
                            <span id="timerText">0s</span>
                        </div>
                        <div class="timer-bar">
                            <div class="timer-fill" id="timerFill"></div>
                        </div>
                    </div>
                    <div class="question-text" id="questionText"></div>
                    <div class="options" id="optionsContainer"></div>
                    <div class="feedback" id="feedback"></div>
                    <div class="leaderboard-overlay" id="leaderboardOverlay"></div>
                    <div class="answer-queue" id="answerQueue"></div>
                </div>

                <!-- Summary Screen -->
                <div id="summaryScreen" class="screen summary-screen">
                    <h2>📊 Quiz Summary</h2>
                    <div id="winnerCard"></div>
                    <div id="podiumContainer"></div>
                    <table class="ranking-table">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Player</th>
                                <th>Score</th>
                                <th>Accuracy</th>
                            </tr>
                        </thead>
                        <tbody id="rankingBody"></tbody>
                    </table>
                    <div id="detailSection"></div>
                    <button
                        class="btn btn-primary"
                        onclick="backToLobby()"
                        style="margin-top: 15px"
                    >
                        Back to Lobby
                    </button>
                </div>

                <!-- Solo Result (for single-player mode) -->
                <div id="resultScreen" class="screen">
                    <h2>🎉 Quiz Complete!</h2>
                    <div
                        style="
                            font-size: 3em;
                            text-align: center;
                            margin: 20px 0;
                        "
                        id="finalScore"
                    >
                        0
                    </div>
                    <div
                        style="
                            text-align: center;
                            color: #666;
                            margin-bottom: 20px;
                        "
                        id="resultMessage"
                    ></div>
                    <button class="btn btn-success" onclick="backToLobby()">
                        Back to Lobby
                    </button>
                </div>
            </div>
        </div>
        <div class="confetti-layer" id="confettiLayer"></div>

        <script>
            // ═══════════════════════════════════════════════════════════
            //  STATE
            // ═══════════════════════════════════════════════════════════

            let currentUser = null;
            let authToken = null;
            let ws = null;
            let currentRoomCode = null;
            let currentQuestion = null;
            let questionOrder = 0;
            let totalQuestions = 5;
            let resultMode = "instant";
            let isMaster = false;
            let roomMasterId = null;
            let wsAuthenticated = false;
            let wsQueue = [];
            let roomPollingInterval = null;
            let transitionCountdownTimer = null;
            let waitingRecoveryTimer = null;
            let questionTimerInterval = null;
            let timePerQuestionSeconds = 0;
            let currentQuestionStartedAt = null;
            let answerSubmitted = false;
            let questionInputLocked = false;
            let deletingRoomCode = null;
            const locallyDeletedRooms = new Set();

            // ═══════════════════════════════════════════════════════════
            //  SCREEN MANAGEMENT
            // ═══════════════════════════════════════════════════════════

            function showScreen(screenId) {
                const screens = document.querySelectorAll(".screen");
                screens.forEach((s) => {
                    s.style.display = "none";
                    s.classList.remove("active");
                });
                const target = document.getElementById(screenId);
                target.classList.add("active");
                // Loading screen uses flex, others use block
                if (screenId === "loadingScreen") {
                    target.style.display = "flex";
                } else {
                    target.style.display = "block";
                }
            }

            function updateProgress() {
                const pct = (questionOrder / totalQuestions) * 100;
                document.getElementById("progressFill").style.width = pct + "%";
            }

            function showUserHeader(show) {
                document.getElementById("logoutBtn").style.display = show
                    ? "block"
                    : "none";
                document.getElementById("userInfo").style.display = show
                    ? "flex"
                    : "none";
            }

            function showScoreBar(show) {
                document.getElementById("headerScore").style.display = show
                    ? "block"
                    : "none";
                document.getElementById("progressBar").style.display = show
                    ? "block"
                    : "none";
            }

            function escapeHtml(value) {
                return String(value ?? "").replace(
                    /[&<>"']/g,
                    (char) =>
                        ({
                            "&": "&amp;",
                            "<": "&lt;",
                            ">": "&gt;",
                            '"': "&quot;",
                            "'": "&#39;",
                        })[char],
                );
            }

            function getUrlRoomCode() {
                const code = new URLSearchParams(window.location.search).get(
                    "room",
                );
                return code ? code.trim().toUpperCase() : null;
            }

            function setRoomUrl(roomCode) {
                const url = new URL(window.location.href);
                if (roomCode) url.searchParams.set("room", roomCode);
                else url.searchParams.delete("room");
                window.history.replaceState(
                    {},
                    "",
                    `${url.pathname}${url.search}${url.hash}`,
                );
            }

            function getSavedRoomCode() {
                return (
                    getUrlRoomCode() ||
                    localStorage.getItem("roomCode")?.toUpperCase() ||
                    null
                );
            }

            function persistRoomCode(roomCode) {
                if (!roomCode) return;
                const code = roomCode.toUpperCase();
                currentRoomCode = code;
                localStorage.setItem("roomCode", code);
                setRoomUrl(code);
            }

            function clearRoomReference() {
                clearWaitingRecoveryTimer();
                stopQuestionTimer();
                hideLeaderboardOverlay();
                currentRoomCode = null;
                roomMasterId = null;
                isMaster = false;
                localStorage.removeItem("roomCode");
                setRoomUrl(null);
                updateActiveRoomPanel();
            }

            function updateActiveRoomPanel() {
                const panel = document.getElementById("activeRoomPanel");
                if (!panel) return;
                const code = currentRoomCode || getSavedRoomCode();
                panel.classList.toggle("hidden", !code);
                if (code) {
                    document.getElementById("activeRoomCode").textContent =
                        code;
                }
                const deleteBtn = document.getElementById("activeRoomDeleteBtn");
                if (deleteBtn) {
                    const canDelete =
                        !!code &&
                        !!currentUser &&
                        (isMaster || roomMasterId === currentUser.id);
                    deleteBtn.classList.toggle("hidden", !canDelete);
                }
            }

            // Polling for room state updates
            function startRoomPolling() {
                stopRoomPolling();
                roomPollingInterval = setInterval(async () => {
                    if (!currentRoomCode) return;
                    try {
                        const data = await api(
                            "GET",
                            `/api/rooms/${currentRoomCode}`,
                        );
                        if (data.success) {
                            renderPlayerList(
                                data.room.players,
                                data.room.masterId,
                            );
                        }
                    } catch (_) {}
                }, 3000);
            }

            function stopRoomPolling() {
                if (roomPollingInterval) {
                    clearInterval(roomPollingInterval);
                    roomPollingInterval = null;
                }
            }

            // ═══════════════════════════════════════════════════════════
            //  API HELPERS
            // ═══════════════════════════════════════════════════════════

            async function api(method, path, body = null) {
                const opts = {
                    method,
                    headers: {
                        "Content-Type": "application/json",
                        ...(authToken
                            ? { Authorization: `Bearer ${authToken}` }
                            : {}),
                    },
                };
                if (body) opts.body = JSON.stringify(body);
                const res = await fetch(path, opts);
                return res.json();
            }

            // ═══════════════════════════════════════════════════════════
            //  AUTH
            // ═══════════════════════════════════════════════════════════

            async function registerUser() {
                const username = document
                    .getElementById("usernameInput")
                    .value.trim();
                const errEl = document.getElementById("loginError");

                if (!username || username.length < 2) {
                    errEl.textContent =
                        "Username must be at least 2 characters";
                    return;
                }

                showScreen("loadingScreen");

                try {
                    const data = await api("POST", "/api/register", {
                        username,
                    });
                    if (data.success) {
                        currentUser = data.user;
                        authToken = data.token;
                        localStorage.setItem("authToken", authToken);
                        localStorage.setItem("userId", currentUser.id);
                        localStorage.setItem("username", currentUser.username);
                        localStorage.setItem("userAvatar", currentUser.avatar);
                        const roomFromLink = getUrlRoomCode();
                        if (roomFromLink) {
                            await restoreRoomFromCode(roomFromLink);
                        } else {
                            enterLobby();
                        }
                    } else {
                        showScreen("loginScreen");
                        errEl.textContent =
                            data.message || "Registration failed";
                    }
                } catch (e) {
                    showScreen("loginScreen");
                    errEl.textContent = "Connection error";
                }
            }

            async function logout() {
                try {
                    await api("POST", "/api/logout");
                } catch (_) {}
                currentUser = null;
                authToken = null;
                clearRoomReference();
                localStorage.removeItem("authToken");
                localStorage.removeItem("userId");
                localStorage.removeItem("username");
                disconnectWS();
                showUserHeader(false);
                showScoreBar(false);
                showScreen("loginScreen");
            }

            async function validateSession() {
                const savedToken = localStorage.getItem("authToken");
                if (!savedToken) return false;

                authToken = savedToken;
                try {
                    const data = await api("GET", "/api/auth/validate");
                    if (data.success) {
                        currentUser = data.user;
                        return true;
                    }
                } catch (_) {}
                return false;
            }

            // ═══════════════════════════════════════════════════════════
            //  WEBSOCKET
            // ═══════════════════════════════════════════════════════════

            function connectWS() {
                if (ws && ws.readyState === WebSocket.OPEN) return;

                const protocol =
                    location.protocol === "https:" ? "wss:" : "ws:";
                ws = new WebSocket(`${protocol}//${location.host}/ws`);
                wsAuthenticated = false;
                wsQueue = [];

                ws.onopen = () => {
                    ws.send(JSON.stringify({ type: "auth", token: authToken }));
                };

                ws.onmessage = (event) => {
                    const data = JSON.parse(event.data);

                    // Handle auth_ok first — flush queued messages
                    if (data.type === "auth_ok") {
                        wsAuthenticated = true;
                        // Rejoin room if reconnecting
                        const savedRoom = getSavedRoomCode();
                        if (savedRoom) {
                            persistRoomCode(savedRoom);
                            wsQueue.push({
                                type: "join_room",
                                roomCode: savedRoom,
                                token: authToken,
                            });
                        }
                        // Flush queue
                        for (const msg of wsQueue) {
                            ws.send(JSON.stringify(msg));
                        }
                        wsQueue = [];
                        // Refresh room state after rejoin
                        if (savedRoom) {
                            setTimeout(() => refreshRoomState(), 300);
                        }
                        return;
                    }

                    handleWSMessage(data);
                };

                ws.onclose = () => {
                    wsAuthenticated = false;
                    // Auto-reconnect after 3 seconds
                    if (authToken) {
                        setTimeout(connectWS, 3000);
                    }
                };
            }

            function disconnectWS() {
                if (ws) {
                    ws.close();
                    ws = null;
                }
            }

            function wsSend(data) {
                if (ws && ws.readyState === WebSocket.OPEN && wsAuthenticated) {
                    ws.send(JSON.stringify(data));
                } else {
                    wsQueue.push(data);
                }
            }

            function handleWSMessage(data) {
                switch (data.type) {
                    case "auth_ok":
                        break;
                    case "room_joined":
                        break;
                    case "player_joined":
                        addPlayerToList(data.player);
                        break;
                    case "player_left":
                        removePlayerFromList(data.userId);
                        break;
                    case "player_kicked":
                        if (data.userId === currentUser.id) {
                            alert("You have been kicked from the room.");
                            clearRoomReference();
                            enterLobby();
                        } else {
                            removePlayerFromList(data.userId);
                        }
                        break;
                    case "player_ready":
                        updatePlayerReady(data.userId, data.isReady);
                        break;
                    case "user_connected":
                        // Refresh room state
                        if (currentRoomCode) refreshRoomState();
                        break;
                    case "user_disconnected":
                        break;
                    case "game_started":
                        clearWaitingRecoveryTimer();
                        questionOrder = 0;
                        totalQuestions = data.totalQuestions;
                        resultMode = data.resultMode;
                        stopRoomPolling();
                        showScoreBar(true);
                        handleNextQuestion(data);
                        break;
                    case "next_question":
                        stopTransitionCountdown();
                        handleNextQuestion(data);
                        break;
                    case "question_transition_scheduled":
                        startTransitionCountdown(data);
                        break;
                    case "answer_result":
                        handleAnswerResult(data);
                        break;
                    case "game_over":
                        stopTransitionCountdown();
                        clearWaitingRecoveryTimer();
                        if (
                            currentRoomCode &&
                            (document.getElementById("quizScreen").style
                                .display !== "none" ||
                                document.getElementById("loadingScreen").style
                                    .display !== "none")
                        ) {
                            showSummary(data.summary);
                        }
                        break;
                    case "room_deleted": {
                        const deletedCode = data.roomCode?.toUpperCase();
                        const savedCode = getSavedRoomCode();
                        if (
                            deletedCode &&
                            (deletedCode === currentRoomCode ||
                                deletedCode === savedCode)
                        ) {
                            const isLocalDelete =
                                deletingRoomCode === deletedCode ||
                                locallyDeletedRooms.has(deletedCode);
                            clearRoomReference();
                            enterLobby();
                            if (!isLocalDelete) {
                                alert(
                                    data.reason === "idle_timeout"
                                        ? "Room expired because it was idle."
                                        : "Room was deleted.",
                                );
                            }
                        }
                        break;
                    }
                    case "error":
                        console.error("WS error:", data.message);
                        break;
                }
            }

            // ═══════════════════════════════════════════════════════════
            //  LOBBY
            // ═══════════════════════════════════════════════════════════

            function enterLobby() {
                clearWaitingRecoveryTimer();
                stopQuestionTimer();
                hideLeaderboardOverlay();
                document.getElementById("userAvatar").src =
                    currentUser.avatar ||
                    `https://api.dicebear.com/7.x/thumbs/svg?seed=${encodeURIComponent(currentUser.username)}`;
                document.getElementById("userName").textContent =
                    currentUser.username;
                showUserHeader(true);
                showScoreBar(false);
                showScreen("lobbyScreen");
                updateActiveRoomPanel();
                connectWS();
            }

            function showCreateRoom() {
                document
                    .getElementById("createForm")
                    .classList.remove("hidden");
                document.getElementById("joinForm").classList.add("hidden");
            }

            function showJoinRoom() {
                document.getElementById("joinForm").classList.remove("hidden");
                document.getElementById("createForm").classList.add("hidden");
            }

            function toggleCustomQ() {
                const isCustom =
                    document.getElementById("setQuestionSource").value ===
                    "custom";
                document
                    .getElementById("customQEditor")
                    .classList.toggle("hidden", !isCustom);
            }

            let customQuestions = [];
            function addCustomQuestion() {
                const idx = customQuestions.length;
                customQuestions.push({
                    text: "",
                    type: "multiple_choice",
                    options: ["", "", "", ""],
                    correct_answer: "",
                });

                const list = document.getElementById("customQList");
                const div = document.createElement("div");
                div.className = "custom-q-form";
                div.id = `cq_${idx}`;
                div.innerHTML = `
                    <strong>Q${idx + 1}</strong>
                    <input type="text" placeholder="Question text" onchange="customQuestions[${idx}].text=this.value" />
                    <select onchange="setCustomQuestionType(${idx}, this.value)">
                        <option value="multiple_choice">Multiple Choice</option>
                        <option value="true_false">True / False</option>
                        <option value="fill_blank">Fill in Blank</option>
                    </select>
                    <input type="text" placeholder="Option A" onchange="customQuestions[${idx}].options[0]=this.value" />
                    <input type="text" placeholder="Option B" onchange="customQuestions[${idx}].options[1]=this.value" />
                    <input type="text" placeholder="Option C" onchange="customQuestions[${idx}].options[2]=this.value" />
                    <input type="text" placeholder="Option D" onchange="customQuestions[${idx}].options[3]=this.value" />
                    <input type="text" placeholder="Correct Answer" onchange="customQuestions[${idx}].correct_answer=this.value" />
                `;
                list.appendChild(div);
            }

            function setCustomQuestionType(index, type) {
                const question = customQuestions[index];
                if (!question) return;
                question.type = type;
                if (type === "true_false") {
                    question.options = ["True", "False"];
                    question.correct_answer = "True";
                } else if (type === "fill_blank") {
                    question.options = [];
                } else if (!Array.isArray(question.options) || question.options.length < 4) {
                    question.options = ["", "", "", ""];
                }
            }

            // ═══════════════════════════════════════════════════════════
            //  ROOM MANAGEMENT
            // ═══════════════════════════════════════════════════════════

            async function createRoom() {
                const errEl = document.getElementById("lobbyError");
                const delaySeconds = parseInt(
                    document.getElementById("setQuestionDelay").value,
                    10,
                );
                const timeLimitSeconds = parseInt(
                    document.getElementById("setTimePerQuestion").value,
                    10,
                );
                const idleTimeoutSeconds = parseInt(
                    document.getElementById("setRoomIdleTimeout").value,
                    10,
                );
                const settings = {
                    maxPlayers:
                        parseInt(
                            document.getElementById("setMaxPlayers").value,
                        ) || 6,
                    questionCount:
                        parseInt(
                            document.getElementById("setQuestionCount").value,
                        ) || 5,
                    questionSource:
                        document.getElementById("setQuestionSource").value,
                    questionMode:
                        document.getElementById("setQuestionMode").value,
                    resultMode: document.getElementById("setResultMode").value,
                    questionDelaySeconds: Number.isFinite(delaySeconds)
                        ? delaySeconds
                        : 10,
                    timePerQuestion: Number.isFinite(timeLimitSeconds)
                        ? timeLimitSeconds
                        : 0,
                    roomIdleTimeoutSeconds: Number.isFinite(idleTimeoutSeconds)
                        ? idleTimeoutSeconds
                        : 1800,
                    customQuestions:
                        document.getElementById("setQuestionSource").value ===
                        "custom"
                            ? customQuestions
                            : [],
                };

                try {
                    const data = await api("POST", "/api/rooms", settings);
                    if (data.success) {
                        persistRoomCode(data.room.code);
                        isMaster = true;
                        // Add masterId so showRoomScreen can render correctly
                        data.room.masterId = currentUser.id;
                        // Add master as first player for room display
                        if (!data.room.players) {
                            data.room.players = [
                                {
                                    userId: currentUser.id,
                                    username: currentUser.username,
                                    avatar: currentUser.avatar,
                                    isReady: true,
                                    score: 0,
                                },
                            ];
                        }
                        wsSend({
                            type: "join_room",
                            roomCode: currentRoomCode,
                            token: authToken,
                        });
                        showRoomScreen(data.room);
                    } else {
                        errEl.textContent = data.message;
                    }
                } catch (e) {
                    errEl.textContent = "Failed to create room";
                }
            }

            async function joinRoom() {
                const code = document
                    .getElementById("roomCodeInput")
                    .value.trim()
                    .toUpperCase();
                const errEl = document.getElementById("lobbyError");

                if (!code || code.length < 4) {
                    errEl.textContent = "Enter a valid room code";
                    return;
                }

                try {
                    const data = await api("POST", `/api/rooms/${code}/join`);
                    if (data.success) {
                        persistRoomCode(code);
                        isMaster = data.room.masterId === currentUser.id;
                        wsSend({
                            type: "join_room",
                            roomCode: code,
                            token: authToken,
                        });
                        showRoomScreen(data.room);
                    } else {
                        errEl.textContent = data.message;
                    }
                } catch (e) {
                    errEl.textContent = "Failed to join room";
                }
            }

            async function leaveRoom() {
                if (currentRoomCode) {
                    stopRoomPolling();
                    try {
                        await api(
                            "POST",
                            `/api/rooms/${currentRoomCode}/leave`,
                        );
                    } catch (_) {}
                    wsSend({
                        type: "leave_room",
                        roomCode: currentRoomCode,
                        token: authToken,
                    });
                    clearRoomReference();
                    enterLobby();
                }
            }

            async function toggleReady() {
                if (!currentRoomCode || isMaster) return;
                const data = await api(
                    "POST",
                    `/api/rooms/${currentRoomCode}/ready`,
                );
                if (data.success) {
                    const btn = document.getElementById("readyBtn");
                    btn.textContent = data.isReady ? "Not Ready" : "Ready";
                    btn.className = data.isReady
                        ? "btn btn-danger"
                        : "btn btn-primary";
                }
            }

            async function kickPlayer(userId) {
                if (!currentRoomCode) return;
                await api("POST", `/api/rooms/${currentRoomCode}/kick`, {
                    targetUserId: userId,
                    code: currentRoomCode,
                });
            }

            async function startGame() {
                if (!currentRoomCode) return;
                const errEl = document.getElementById("roomError");
                errEl.textContent = ""; // Clear previous errors
                try {
                    const data = await api(
                        "POST",
                        `/api/rooms/${currentRoomCode}/start`,
                    );
                    if (!data.success) {
                        errEl.textContent = "⚠ " + data.message;
                    } else {
                        stopRoomPolling();
                        // Transition to quiz from REST response (fallback)
                        if (data.gameStarted && data.questions) {
                            handleNextQuestion({
                                questions: data.questions,
                                questionNumber: data.questionNumber,
                                totalQuestions: data.totalQuestions,
                                resultMode: data.resultMode,
                                timePerQuestionSeconds:
                                    data.timePerQuestionSeconds,
                                questionStartedAt: data.questionStartedAt,
                            });
                        }
                    }
                } catch (e) {
                    errEl.textContent = "Failed to start game";
                }
            }

            async function refreshRoomState() {
                if (!currentRoomCode) return;
                try {
                    const data = await api(
                        "GET",
                        `/api/rooms/${currentRoomCode}`,
                    );
                    if (data.success) {
                        showRoomScreen(data.room);
                    }
                } catch (_) {}
            }

            async function restoreRoomFromCode(roomCode) {
                const code = roomCode?.trim().toUpperCase();
                if (!code) return false;

                persistRoomCode(code);
                document.getElementById("userAvatar").src =
                    currentUser.avatar ||
                    `https://api.dicebear.com/7.x/thumbs/svg?seed=${encodeURIComponent(currentUser.username)}`;
                document.getElementById("userName").textContent =
                    currentUser.username;
                showUserHeader(true);
                showScreen("loadingScreen");
                connectWS();

                try {
                    const data = await api("GET", `/api/rooms/${code}/state`);
                    if (!data.success || !data.room) {
                        if (data.message === "Forbidden") {
                            currentRoomCode = null;
                            roomMasterId = null;
                            localStorage.removeItem("roomCode");
                            setRoomUrl(code);
                            enterLobby();
                            showJoinRoom();
                            document.getElementById("roomCodeInput").value =
                                code;
                            document.getElementById("lobbyError").textContent =
                                "Join this room to continue";
                            return false;
                        }
                        clearRoomReference();
                        enterLobby();
                        return false;
                    }

                    roomMasterId = data.room.masterId;
                    isMaster = data.room.masterId === currentUser.id;
                    persistRoomCode(data.room.code);
                    wsSend({
                        type: "join_room",
                        roomCode: data.room.code,
                        token: authToken,
                    });

                    if (data.finished && data.summary) {
                        if (isCurrentUserRoomParticipant(data.room)) {
                            showSummary(data.summary);
                        } else {
                            clearRoomReference();
                            enterLobby();
                        }
                        return true;
                    }

                    if (data.inGame && data.gameState) {
                        questionOrder = data.gameState.questionNumber;
                        totalQuestions = data.gameState.totalQuestions;
                        resultMode = data.gameState.resultMode;
                        showScoreBar(true);
                        handleNextQuestion({
                            questions: data.gameState.questions,
                            questionNumber: data.gameState.questionNumber,
                            totalQuestions: data.gameState.totalQuestions,
                            resultMode: data.gameState.resultMode,
                            timePerQuestionSeconds:
                                data.gameState.timePerQuestionSeconds,
                            questionStartedAt:
                                data.gameState.questionStartedAt,
                        });
                        if (data.gameState.alreadyAnswered) {
                            setTimeout(() => {
                                answerSubmitted = true;
                                stopQuestionTimer();
                                questionInputLocked = true;
                                setAnswerControlsDisabled(true);
                                if (data.gameState.transition) {
                                    startTransitionCountdown(
                                        data.gameState.transition,
                                    );
                                } else {
                                    document.getElementById(
                                        "answerQueue",
                                    ).textContent =
                                        "Waiting for other players...";
                                    startWaitingRecoveryTimer();
                                }
                            }, 100);
                        }
                        return true;
                    }

                    if (data.room.status === "waiting") {
                        showRoomScreen(data.room);
                        return true;
                    }

                    enterLobby();
                    return false;
                } catch (_) {
                    clearRoomReference();
                    enterLobby();
                    return false;
                }
            }

            async function returnToActiveRoom() {
                const code = getSavedRoomCode();
                if (!code) return;
                await restoreRoomFromCode(code);
            }

            async function deleteSavedRoom() {
                const code = getSavedRoomCode();
                if (!code) return;

                const errEl = document.getElementById("lobbyError");
                errEl.textContent = "";
                if (!confirm(`Delete room ${code}?`)) return;

                deletingRoomCode = code;
                locallyDeletedRooms.add(code);
                try {
                    const data = await api("DELETE", `/api/rooms/${code}`);
                    if (data.success) {
                        clearRoomReference();
                        enterLobby();
                        return;
                    }

                    if (data.message === "Room not found") {
                        clearRoomReference();
                        enterLobby();
                        return;
                    }

                    errEl.textContent = data.message || "Failed to delete room";
                } catch (_) {
                    errEl.textContent = "Failed to delete room";
                } finally {
                    deletingRoomCode = null;
                    setTimeout(() => locallyDeletedRooms.delete(code), 5000);
                }
            }

            // ═══════════════════════════════════════════════════════════
            //  ROOM UI
            // ═══════════════════════════════════════════════════════════

            function showRoomScreen(room) {
                persistRoomCode(room.code);
                showScreen("roomScreen");
                showScoreBar(false);

                document.getElementById("roomCodeDisplay").textContent =
                    room.code;

                // Settings
                const s = room.settings;
                const settingsInfo =
                    document.getElementById("roomSettingsInfo");
                const settingsText = document.createElement("div");
                settingsText.style.fontSize = "14px";
                settingsText.style.color = "#666";
                settingsText.style.whiteSpace = "pre-line";
                settingsText.textContent =
                    `Max Players: ${s.max_players} | Questions: ${s.question_count}\n` +
                    `Question Delay: ${s.question_delay_seconds ?? 10}s\n` +
                    `Time per Question: ${s.time_per_question_seconds || 0}s\n` +
                    `Idle Timeout: ${s.room_idle_timeout_seconds ?? 1800}s\n` +
                    `Source: ${s.question_source} | Mode: ${
                        s.question_mode === "same_for_all"
                            ? "Same for All"
                            : "Random per Player"
                    }\n` +
                    `Results: ${s.result_mode === "instant" ? "Instant" : "At End"}`;
                settingsInfo.replaceChildren(settingsText);
                // Set master flag BEFORE rendering
                roomMasterId = room.masterId;
                isMaster = room.masterId === currentUser.id;
                document
                    .getElementById("startBtn")
                    .classList.toggle("hidden", !isMaster);

                // Update ready button for master (always ready, disabled)
                const readyBtn = document.getElementById("readyBtn");
                if (isMaster) {
                    readyBtn.textContent = "✓ Always Ready";
                    readyBtn.className = "btn btn-secondary";
                    readyBtn.disabled = true;
                    readyBtn.style.cursor = "not-allowed";
                } else {
                    readyBtn.textContent = "Ready";
                    readyBtn.className = "btn btn-primary";
                    readyBtn.disabled = false;
                    readyBtn.style.cursor = "pointer";
                }

                // Player list
                renderPlayerList(room.players, room.masterId);

                // Start polling for live updates
                startRoomPolling();
            }

            function renderPlayerList(players, masterId) {
                const list = document.getElementById("playerList");
                list.innerHTML = "";
                players.forEach((p) => {
                    const isPlayerMaster = p.userId === masterId;
                    const isMe = p.userId === currentUser.id;
                    const li = document.createElement("li");
                    li.className = "player-item";
                    li.id = `player_${p.userId}`;

                    li.innerHTML = `
                        <img src="${escapeHtml(p.avatar)}" alt="${escapeHtml(p.username)}" />
                        <span class="player-name">
                            ${escapeHtml(p.username)}
                            ${isMe ? " (You)" : ""}
                        </span>
                        ${isPlayerMaster ? '<span class="player-badge" style="background:#fff3e0;color:#e65100">👑 Master</span>' : ""}
                        <span class="player-badge ${p.isReady ? "badge-ready" : "badge-not-ready"}">
                            ${p.isReady ? "✓ Ready" : "✗ Not Ready"}
                        </span>
                        ${
                            isMaster && !isMe && !isPlayerMaster
                                ? `<button class="kick-btn" onclick="kickPlayer('${escapeHtml(p.userId)}')">Kick</button>`
                                : ""
                        }
                    `;
                    list.appendChild(li);
                });
            }

            function addPlayerToList(player) {
                const list = document.getElementById("playerList");
                if (document.getElementById(`player_${player.userId}`)) return;
                const isPlayerMaster = player.userId === roomMasterId;
                const isMe = player.userId === currentUser.id;
                const li = document.createElement("li");
                li.className = "player-item";
                li.id = `player_${player.userId}`;
                li.innerHTML = `
                    <img src="${escapeHtml(player.avatar)}" alt="${escapeHtml(player.username)}" />
                    <span class="player-name">${escapeHtml(player.username)}${isMe ? " (You)" : ""}</span>
                    ${isPlayerMaster ? '<span class="player-badge" style="background:#fff3e0;color:#e65100">👑 Master</span>' : ""}
                    <span class="player-badge badge-not-ready">✗ Not Ready</span>
                    ${
                        isMaster && !isMe && !isPlayerMaster
                            ? `<button class="kick-btn" onclick="kickPlayer('${escapeHtml(player.userId)}')">Kick</button>`
                            : ""
                    }
                `;
                list.appendChild(li);
            }

            function removePlayerFromList(userId) {
                const el = document.getElementById(`player_${userId}`);
                if (el) el.remove();
            }

            function updatePlayerReady(userId, isReady) {
                const el = document.getElementById(`player_${userId}`);
                if (!el) return;
                const badge = el.querySelector(".player-badge");
                if (badge) {
                    badge.className = `player-badge ${isReady ? "badge-ready" : "badge-not-ready"}`;
                    badge.textContent = isReady ? "✓ Ready" : "✗ Not Ready";
                }
            }

            // ═══════════════════════════════════════════════════════════
            //  QUIZ GAME
            // ═══════════════════════════════════════════════════════════

            function handleNextQuestion(data) {
                stopTransitionCountdown();
                stopQuestionTimer();
                hideLeaderboardOverlay();
                clearWaitingRecoveryTimer();
                questionOrder = data.questionNumber;
                totalQuestions = data.totalQuestions;
                resultMode = data.resultMode;
                timePerQuestionSeconds = data.timePerQuestionSeconds || 0;
                currentQuestionStartedAt = data.questionStartedAt || null;
                answerSubmitted = false;
                questionInputLocked = false;
                updateProgress();

                // Get question — could be same for all or per-player
                let question;
                if (data.questions?.all) {
                    question = data.questions.all;
                } else if (data.questions?.[currentUser.id]) {
                    question = data.questions[currentUser.id];
                } else {
                    question = data.questions;
                }

                if (!question) {
                    document.getElementById("answerQueue").textContent =
                        "Question is unavailable. Refreshing room state...";
                    return;
                }

                currentQuestion = question;
                document.getElementById("headerScore").textContent =
                    `Question ${questionOrder}/${totalQuestions}`;
                showScreen("quizScreen");
                displayQuestion();
            }

            function isCurrentUserRoomParticipant(room) {
                return Boolean(
                    currentUser &&
                        room?.players?.some(
                            (player) =>
                                player.userId === currentUser.id ||
                                player.id === currentUser.id,
                        ),
                );
            }

            function clearWaitingRecoveryTimer() {
                if (waitingRecoveryTimer) {
                    clearTimeout(waitingRecoveryTimer);
                    waitingRecoveryTimer = null;
                }
            }

            function startWaitingRecoveryTimer() {
                if (waitingRecoveryTimer) return;

                const queue = document.getElementById("answerQueue");
                const isWaitingText = (value) =>
                    value === "Waiting for other players..." ||
                    value === "Time is up. Waiting for other players...";
                if (
                    !currentRoomCode ||
                    !currentUser ||
                    document.getElementById("quizScreen").style.display ===
                        "none" ||
                    !isWaitingText(queue?.textContent)
                ) {
                    return;
                }

                const roomCode = currentRoomCode;
                const waitingQuestionOrder = questionOrder;

                waitingRecoveryTimer = setTimeout(async () => {
                    waitingRecoveryTimer = null;
                    const currentQueue = document.getElementById("answerQueue");
                    if (
                        currentRoomCode !== roomCode ||
                        document.getElementById("quizScreen").style.display ===
                            "none" ||
                        !isWaitingText(currentQueue?.textContent)
                    ) {
                        return;
                    }

                    try {
                        const data = await api(
                            "GET",
                            `/api/rooms/${roomCode}/state`,
                        );
                        if (!data.success || !data.room) return;
                        if (!isCurrentUserRoomParticipant(data.room)) {
                            clearRoomReference();
                            enterLobby();
                            return;
                        }

                        if (data.finished && data.summary) {
                            showSummary(data.summary);
                            return;
                        }

                        if (!data.inGame || !data.gameState) return;

                        if (
                            data.gameState.questionNumber >
                            waitingQuestionOrder
                        ) {
                            handleNextQuestion({
                                questions: data.gameState.questions,
                                questionNumber: data.gameState.questionNumber,
                                totalQuestions: data.gameState.totalQuestions,
                                resultMode: data.gameState.resultMode,
                                timePerQuestionSeconds:
                                    data.gameState.timePerQuestionSeconds,
                                questionStartedAt:
                                    data.gameState.questionStartedAt,
                            });
                            return;
                        }

                        if (
                            data.gameState.questionNumber ===
                                waitingQuestionOrder &&
                            data.gameState.transition
                        ) {
